    {rowStyles: {[rows.length]: {text:PDF_COLORS.navy, bold:true}}});
  document.getElementById('exXls').onclick = ()=> exportExcel('Trial_Balance.xlsx', 'Trial Balance', ['Code','Account','Debit','Credit'],
    rows.map(r=>[r.a.code, r.a.name, r.debit, r.credit]).concat([['','Total', totalDebit, totalCredit]]));
}

/* =========================================================================
   BALANCE SHEET
========================================================================= */
function renderBS(main){
  const mode = ui.bsMode || 'fy';
  const fy = ui.bsFY===undefined? currentFYEndYear() : ui.bsFY;
  const customMonth = ui.bsMonth || '';
  const today = todayISO();
  // A Balance Sheet is a snapshot, not a range — "as of financial year end" only makes sense for a
  // FY that's already finished. For the current (or a future) FY, show it as of today instead.
  const asOf = mode==='custom'? (monthInputAsOf(customMonth) || today) : (fyRange(fy)[1] > today ? today : fyRange(fy)[1]);
  const asOfLabel = mode==='custom'? (customMonth? fmtDate(asOf) : 'Pick a month') : (fmtDate(asOf)+' (FY'+fy+')');
  const sumB = accts=>accts.reduce((s,a)=>s+accountBalance(a.id,asOf),0);
  const nz = a => Math.abs(accountBalance(a.id,asOf)) > 0.005;

  // group accounts into the 3-level Sage structure: bsGroup (Non-Current/Current) -> accountType -> accounts
  // accounts with a zero balance for the period are left out to keep the report compact
  function threeLevel(topType, bsGroupOrder){
    const accts = CO().accounts.filter(a=>a.type===topType && nz(a));
    return bsGroupOrder.map(bsGroup=>{
      const inGroup = accts.filter(a=>typeMeta(a.accountType).bsGroup===bsGroup);
      const byAccountType = {};
      inGroup.forEach(a=>{ (byAccountType[a.accountType] = byAccountType[a.accountType]||[]).push(a); });
      const subgroups = Object.entries(byAccountType).map(([accountType, list])=>({accountType, list, total:sumB(list)}));
      return { bsGroup, subgroups, total: sumB(inGroup) };
    }).filter(g=>g.subgroups.length);
  }

  const assetGroups = threeLevel('Asset', ['Non-Current Assets','Current Assets']);
  const liabGroups = threeLevel('Liability', ['Non-Current Liabilities','Current Liabilities']);
  const equity = CO().accounts.filter(a=>a.type==='Equity' && nz(a));
  const income = CO().accounts.filter(a=>a.type==='Income').reduce((s,a)=>s+accountBalance(a.id,asOf),0);
  const expense = CO().accounts.filter(a=>a.type==='Expense').reduce((s,a)=>s+accountBalance(a.id,asOf),0);
  const netIncome = income - expense;
  const totalAssets = assetGroups.reduce((s,g)=>s+g.total,0);
  const totalLiab = liabGroups.reduce((s,g)=>s+g.total,0);
  const totalEquity = sumB(equity) + netIncome;
  const totLiabEq = totalLiab + totalEquity;

  function renderGroups(groups){
    return groups.map(g=>`
      <div class="statement-group" style="background:#dbe6f5;color:var(--navy)">${g.bsGroup}</div>
      ${g.subgroups.map(sg=>`
        <div class="statement-group" style="background:#eef3fa;color:var(--navy2);font-size:10.5px">${sg.accountType}</div>
        ${sg.list.map(a=>`<div class="statement-row indent"><span>${a.name}</span><span class="num">${fmt(accountBalance(a.id,asOf))}</span></div>`).join('')}
      `).join('')}
      <div class="statement-row total"><span>Total ${g.bsGroup}</span><span class="num">${fmt(g.total)}</span></div>
    `).join('');
  }

  main.innerHTML = `
    <div class="pagehead"><div class="pagetitle">Statement of Financial Position</div><div class="pagesub">As of today for the current year, or as of financial year-end for a past year</div></div>
    <div class="toolbar">
      ${asOfModeToggleHTML('bs')}
      ${mode==='custom'? `<input type="month" id="bsMonth" value="${customMonth}" style="width:170px">` : fyInputHTML('bsFYSel', fy, false)}
      <button class="linkbtn" id="exPdf"><span class="ic">P</span>Export PDF</button>
      <button class="linkbtn" id="exXls"><span class="ic">X</span>Export Excel</button>
    </div>
    <div class="card">
      <div class="statement-group">Assets</div>
      ${assetGroups.length? renderGroups(assetGroups) : `<div class="hint" style="padding:8px 0">No asset balances for this period.</div>`}
      <div class="statement-row total" style="border-top:2px solid var(--blue)"><span>Total Assets</span><span class="num">${fmt(totalAssets)}</span></div>

      <div class="statement-group">Equity &amp; Liabilities</div>
      <div class="statement-group" style="background:#dbe6f5;color:var(--navy)">Equity</div>
      ${equity.map(a=>`<div class="statement-row indent"><span>${a.name}</span><span class="num">${fmt(accountBalance(a.id,asOf))}</span></div>`).join('')}
      <div class="statement-row indent"><span>Net income to date</span><span class="num">${fmt(netIncome)}</span></div>
      <div class="statement-row total"><span>Total Equity</span><span class="num">${fmt(totalEquity)}</span></div>

      ${renderGroups(liabGroups)}

      <div class="statement-row total" style="margin-top:10px;border-top:2px solid var(--blue)">
        <span>Total Equity &amp; Liabilities</span>
        <span class="num" style="color:${Math.abs(totLiabEq-totalAssets)<0.01?'var(--green)':'var(--red)'}">${fmt(totLiabEq)}</span>
      </div>
    </div>
  `;
  document.getElementById('bsMode').onchange = e=>{ ui.bsMode=e.target.value; renderBS(main); };
  if(mode==='custom') document.getElementById('bsMonth').onchange = e=>{ ui.bsMonth=e.target.value; renderBS(main); };
  else wireFYInput('bsFYSel', false, v=>{ ui.bsFY = v; renderBS(main); });

  function flatRows(groups, fmtFn, rowStyles, rows){
    groups.forEach(g=>{
      rows.push([g.bsGroup, fmtFn(0)===fmtFn(0)?'':'']); rowStyles[rows.length-1] = {text:PDF_COLORS.navy, bold:true};
      g.subgroups.forEach(sg=>{
        rows.push([sg.accountType, '']); rowStyles[rows.length-1] = {text:PDF_COLORS.navy2, bold:true, fontSize:7.5};
        sg.list.forEach(a=>rows.push([a.name, fmtFn(accountBalance(a.id,asOf))]));
      });
      rows.push(['Total '+g.bsGroup, fmtFn(g.total)]); rowStyles[rows.length-1] = {text:PDF_COLORS.navy, bold:true};
    });
    return rows;
  }
  document.getElementById('exPdf').onclick = ()=>{
    const line = a=>[a.name, fmt(accountBalance(a.id,asOf))];
    const rowStyles = {};
    const rows = [];
    rows.push(['Assets','']); rowStyles[rows.length-1] = {fill:PDF_COLORS.navy2, text:[255,255,255], bold:true};
    flatRows(assetGroups, fmt, rowStyles, rows);
    rows.push(['Total Assets', fmt(totalAssets)]); rowStyles[rows.length-1] = {text:PDF_COLORS.navy, bold:true};
    rows.push(['Equity & Liabilities','']); rowStyles[rows.length-1] = {fill:PDF_COLORS.navy2, text:[255,255,255], bold:true};
    rows.push(['Equity','']); rowStyles[rows.length-1] = {text:PDF_COLORS.navy, bold:true};
    equity.forEach(a=>rows.push(line(a)));
    rows.push(['Net income to date', fmt(netIncome)]);
    rows.push(['Total Equity', fmt(totalEquity)]); rowStyles[rows.length-1] = {text:PDF_COLORS.navy, bold:true};
    flatRows(liabGroups, fmt, rowStyles, rows);
    rows.push(['Total Equity & Liabilities', fmt(totLiabEq)]); rowStyles[rows.length-1] = {fill:PDF_COLORS.navy2, text:[255,255,255], bold:true};
    exportPDF('Statement of Financial Position', CO().name+' — For: '+asOfLabel, ['Account','Amount'], rows, {rowStyles});
  };
  document.getElementById('exXls').onclick = ()=>{
    const line = a=>[a.name, accountBalance(a.id,asOf)];
    const rowsX = [];
    rowsX.push(['Assets','']);
    flatRows(assetGroups, x=>x, {}, rowsX);
    rowsX.push(['Total Assets', totalAssets]);
    rowsX.push(['Equity & Liabilities','']);
    rowsX.push(['Equity','']);
    equity.forEach(a=>rowsX.push(line(a)));
    rowsX.push(['Net income to date', netIncome]);
    rowsX.push(['Total Equity', totalEquity]);
    flatRows(liabGroups, x=>x, {}, rowsX);
    rowsX.push(['Total Equity & Liabilities', totLiabEq]);
    exportExcel('Statement_of_Financial_Position.xlsx', 'Balance Sheet', ['Account','Amount'], rowsX);
  };
}

/* =========================================================================
   INCOME STATEMENT
========================================================================= */
function monthRange(y, m){ // returns [start, end] iso for given year(YYYY) and month index 0-11
  const s = new Date(y, m, 1);
  const e = new Date(y, m+1, 0);
  return [localISO(s), localISO(e)];
}
function financialYearMonths(endDate){
  // 12 months ending in the month of endDate, oldest first (matches "March->Feb" style Sage report)
  const end = new Date(endDate);
  const months = [];
  for(let i=11;i>=0;i--){
    const d = new Date(end.getFullYear(), end.getMonth()-i, 1);
    months.push(monthRange(d.getFullYear(), d.getMonth()));
  }
  return months;
}
function renderIS(main){
  const mode = ui.isMode || 'period'; // 'period' | 'monthly'
  const rangeMode = ui.isRangeMode || 'fy'; // only used when mode==='period'
  const fy = ui.isFY===undefined? currentFYEndYear() : ui.isFY;
  const customFrom = ui.isFrom || '', customTo = ui.isTo || '';
  const comparative = !!ui.isComparative && rangeMode==='fy';
  let start, end, periodLabel;
  if(mode==='period' && rangeMode==='custom'){
    const r = monthInputRange(customFrom, customTo) || [null,null];
    start = r[0]; end = r[1];
    periodLabel = (start&&end)? monthLabelRange(start,end) : 'Pick a range';
  } else {
    [start,end] = fyRange(fy);
    periodLabel = 'FY'+fy+' ('+fyLabel(fy)+')';
  }
  const [priorStart,priorEnd] = fyRange(fy-1);

  const revenue = CO().accounts.filter(a=>a.accountType==='Revenue');
  const cos = CO().accounts.filter(a=>a.accountType==='Cost of Sales');
  const otherInc = CO().accounts.filter(a=>a.accountType==='Other Income');
  const otherExp = CO().accounts.filter(a=>a.accountType==='Other Expense');
  const taxExp = CO().accounts.filter(a=>a.accountType==='Tax Expense');
  // hide accounts with no movement in either period shown, to keep the report compact
  const nzMove = a => (start&&end&&Math.abs(accountMovement(a.id,start,end))>0.005) || (comparative && Math.abs(accountMovement(a.id,priorStart,priorEnd))>0.005);
  const revenueNZ = revenue.filter(nzMove), cosNZ = cos.filter(nzMove), otherIncNZ = otherInc.filter(nzMove), otherExpNZ = otherExp.filter(nzMove), taxExpNZ = taxExp.filter(nzMove);

  function sumGroup(accts, s, e){ return (s&&e)? accts.reduce((sum,a)=>sum+accountMovement(a.id,s,e),0) : 0; }
  function calcFor(s,e){
    const totRev = sumGroup(revenue,s,e), totCOS = sumGroup(cos,s,e);
    const grossProfit = totRev - totCOS;
    const totOtherInc = sumGroup(otherInc,s,e), totOtherExp = sumGroup(otherExp,s,e);
    const profitBeforeTax = grossProfit + totOtherInc - totOtherExp;
    const totTax = sumGroup(taxExp,s,e);
    const profitAfterTax = profitBeforeTax - totTax;
    return {totRev, totCOS, grossProfit, totOtherInc, totOtherExp, profitBeforeTax, totTax, profitAfterTax};
  }

  main.innerHTML = `
    <div class="pagehead"><div class="pagetitle">Statement of Comprehensive Income</div><div class="pagesub">Revenue, cost of sales, and expenses for ${CO().name}</div></div>
    <div class="toolbar">
      <select id="isMode"><option value="period" ${mode==='period'?'selected':''}>Period</option><option value="monthly" ${mode==='monthly'?'selected':''}>Monthly (year)</option></select>
      ${mode==='period'? rangeModeToggleHTML('isRange') : ''}
      ${mode==='monthly' || rangeMode==='fy'? fyInputHTML('isFYSel', fy, false) : ''}
      ${mode==='period' && rangeMode==='custom'? `<input type="month" id="isFrom" value="${customFrom}" style="width:150px"><input type="month" id="isTo" value="${customTo}" style="width:150px">` : ''}
      ${mode==='period' && rangeMode==='fy'? `<label style="display:flex;align-items:center;gap:6px;font-weight:400;text-transform:none;font-size:12.5px"><input type="checkbox" id="isCompChk" style="width:auto" ${comparative?'checked':''}> Comparative (vs prior year)</label>` : ''}
      <button class="linkbtn" id="exPdf"><span class="ic">P</span>Export PDF</button>
      <button class="linkbtn" id="exXls"><span class="ic">X</span>Export Excel</button>
    </div>
    <div id="isBody"></div>
  `;
  document.getElementById('isMode').onchange = e=>{ ui.isMode=e.target.value; renderIS(main); };
  if(mode==='period'){
    document.getElementById('isRangeMode').onchange = e=>{ ui.isRangeMode=e.target.value; renderIS(main); };
    if(rangeMode==='custom'){
      document.getElementById('isFrom').onchange = e=>{ ui.isFrom=e.target.value; renderIS(main); };
      document.getElementById('isTo').onchange = e=>{ ui.isTo=e.target.value; renderIS(main); };
    }
  }
  const fySelEl = document.getElementById('isFYSel');
  if(fySelEl) wireFYInput('isFYSel', false, v=>{ ui.isFY=v; renderIS(main); });

  if(mode==='period'){
    if(!start || !end){
      document.getElementById('isBody').innerHTML = `<div class="empty"><div class="big">Pick a range</div></div>`;
      document.getElementById('exPdf').onclick = ()=>alert('Pick a from and to month first.');
      document.getElementById('exXls').onclick = ()=>alert('Pick a from and to month first.');
      return;
    }
    const cur = calcFor(start,end), pri = calcFor(priorStart,priorEnd);
    function row(a){
      const c = accountMovement(a.id,start,end);
      return `<div class="statement-row indent"><span>${a.name}</span><span class="num">${fmt(c)}</span>${comparative?`<span class="num" style="color:var(--tx2)">${fmt(accountMovement(a.id,priorStart,priorEnd))}</span>`:''}</div>`;
    }
    document.getElementById('isBody').innerHTML = `
      <div class="card">
        ${comparative? `<div class="statement-row" style="font-weight:700;color:var(--tx2)"><span></span><span class="num">FY${fy}</span><span class="num">FY${fy-1}</span></div>`:''}
        <div class="statement-group">Revenue</div>
        ${revenueNZ.map(a=>row(a)).join('') || `<div class="hint indent">No revenue this period.</div>`}
        <div class="statement-row total"><span>Total Revenue</span><span class="num">${fmt(cur.totRev)}</span>${comparative?`<span class="num">${fmt(pri.totRev)}</span>`:''}</div>
        <div class="statement-group">Cost of Sales</div>
        ${cosNZ.map(a=>row(a)).join('')}
        <div class="statement-row total"><span>Total Cost of Sales</span><span class="num">${fmt(cur.totCOS)}</span>${comparative?`<span class="num">${fmt(pri.totCOS)}</span>`:''}</div>
        <div class="statement-row total" style="border-top:2px solid var(--blue)"><span>Gross Profit</span><span class="num">${fmt(cur.grossProfit)}</span>${comparative?`<span class="num">${fmt(pri.grossProfit)}</span>`:''}</div>
        <div class="statement-group">Other Income</div>
        ${otherIncNZ.map(a=>row(a)).join('')}
        <div class="statement-row total"><span>Total Other Income</span><span class="num">${fmt(cur.totOtherInc)}</span>${comparative?`<span class="num">${fmt(pri.totOtherInc)}</span>`:''}</div>
        <div class="statement-group">Other Expense</div>
        ${otherExpNZ.map(a=>row(a)).join('')}
        <div class="statement-row total"><span>Total Other Expense</span><span class="num">${fmt(cur.totOtherExp)}</span>${comparative?`<span class="num">${fmt(pri.totOtherExp)}</span>`:''}</div>
        <div class="statement-row total" style="margin-top:10px;border-top:2px solid var(--blue)">
          <span>Profit Before Tax</span><span class="num" style="color:${cur.profitBeforeTax>=0?'var(--green)':'var(--red)'}">${fmt(cur.profitBeforeTax)}</span>
          ${comparative?`<span class="num" style="color:${pri.profitBeforeTax>=0?'var(--green)':'var(--red)'}">${fmt(pri.profitBeforeTax)}</span>`:''}
        </div>
        ${taxExpNZ.length? `
        <div class="statement-group">Tax Expense</div>
        ${taxExpNZ.map(a=>row(a)).join('')}
        <div class="statement-row total"><span>Total Tax Expense</span><span class="num">${fmt(cur.totTax)}</span>${comparative?`<span class="num">${fmt(pri.totTax)}</span>`:''}</div>
        <div class="statement-row total" style="border-top:2px solid var(--blue)">
          <span>Net Profit After Tax</span><span class="num" style="color:${cur.profitAfterTax>=0?'var(--green)':'var(--red)'}">${fmt(cur.profitAfterTax)}</span>
          ${comparative?`<span class="num" style="color:${pri.profitAfterTax>=0?'var(--green)':'var(--red)'}">${fmt(pri.profitAfterTax)}</span>`:''}
        </div>` : ''}
      </div>`;
    if(comparative){
      document.querySelectorAll('#isBody .statement-row').forEach(r=>{ r.style.display='grid'; r.style.gridTemplateColumns='1fr 140px 140px'; r.style.gap='10px'; });
    }
    const compChk = document.getElementById('isCompChk');
    if(compChk) compChk.onchange = e=>{ ui.isComparative=e.target.checked; renderIS(main); };
    document.getElementById('exPdf').onclick = ()=>{
      const header = comparative? ['Account','Current','Prior'] : ['Account','Amount'];
      const line = a=> comparative? [a.name, fmt(accountMovement(a.id,start,end)), fmt(accountMovement(a.id,priorStart,priorEnd))] : [a.name, fmt(accountMovement(a.id,start,end))];
      const totalRow = (label,c,p)=> comparative? [label, fmt(c), fmt(p)] : [label, fmt(c)];
      const rows = []; const rowStyles = {};
      const bar = (label)=>{ rows.push(comparative?[label,'','']:[label,'']); rowStyles[rows.length-1] = {fill:PDF_COLORS.navy2, text:[255,255,255], bold:true}; };
      const tot = (label,c,p)=>{ rows.push(totalRow(label,c,p)); rowStyles[rows.length-1] = {text:PDF_COLORS.navy, bold:true}; };
      bar('Revenue'); revenueNZ.forEach(a=>rows.push(line(a))); tot('Total Revenue', cur.totRev, pri.totRev);
      bar('Cost of Sales'); cosNZ.forEach(a=>rows.push(line(a))); tot('Total Cost of Sales', cur.totCOS, pri.totCOS);
      tot('Gross Profit', cur.grossProfit, pri.grossProfit);
      bar('Other Income'); otherIncNZ.forEach(a=>rows.push(line(a))); tot('Total Other Income', cur.totOtherInc, pri.totOtherInc);
      bar('Other Expense'); otherExpNZ.forEach(a=>rows.push(line(a))); tot('Total Other Expense', cur.totOtherExp, pri.totOtherExp);
      tot('Profit Before Tax', cur.profitBeforeTax, pri.profitBeforeTax);
      if(taxExpNZ.length){
        bar('Tax Expense'); taxExpNZ.forEach(a=>rows.push(line(a))); tot('Total Tax Expense', cur.totTax, pri.totTax);
        tot('Net Profit After Tax', cur.profitAfterTax, pri.profitAfterTax);
      }
      exportPDF('Statement of Comprehensive Income', CO().name+' — '+periodLabel, header, rows, {rowStyles});
    };
    document.getElementById('exXls').onclick = ()=>{
      const header = comparative? ['Account','Current','Prior'] : ['Account','Amount'];
      const line = a=> comparative? [a.name, accountMovement(a.id,start,end), accountMovement(a.id,priorStart,priorEnd)] : [a.name, accountMovement(a.id,start,end)];
      const totalRow = (label,c,p)=> comparative? [label, c, p] : [label, c];
      const rows = [ ['Revenue',''], ...revenueNZ.map(line), totalRow('Total Revenue', cur.totRev, pri.totRev),
        ['Cost of Sales',''], ...cosNZ.map(line), totalRow('Total Cost of Sales', cur.totCOS, pri.totCOS), totalRow('Gross Profit', cur.grossProfit, pri.grossProfit),
        ['Other Income',''], ...otherIncNZ.map(line), totalRow('Total Other Income', cur.totOtherInc, pri.totOtherInc),
        ['Other Expense',''], ...otherExpNZ.map(line), totalRow('Total Other Expense', cur.totOtherExp, pri.totOtherExp), totalRow('Profit Before Tax', cur.profitBeforeTax, pri.profitBeforeTax),
        ...(taxExpNZ.length? [['Tax Expense',''], ...taxExpNZ.map(line), totalRow('Total Tax Expense', cur.totTax, pri.totTax), totalRow('Net Profit After Tax', cur.profitAfterTax, pri.profitAfterTax)] : []) ];
      exportExcel('Statement_of_Comprehensive_Income.xlsx', 'Income Statement', header, rows);
    };
  } else {
    // MONTHLY — 12 columns spanning the selected financial year exactly
    const months = [];
    let cursor = new Date(start);
    for(let i=0;i<12;i++){ months.push(monthRange(cursor.getFullYear(), cursor.getMonth())); cursor.setMonth(cursor.getMonth()+1); }
    const monthLabel = ([s])=> new Date(s).toLocaleDateString('en-ZA',{month:'short',year:'2-digit'});
    function rowMonthly(a){
      const vals = months.map(([s,e])=>accountMovement(a.id,s,e));
      const tot = vals.reduce((x,y)=>x+y,0);
      return {name:a.name, vals, tot};
    }
    const revRows = revenueNZ.map(rowMonthly), cosRows = cosNZ.map(rowMonthly), oiRows = otherIncNZ.map(rowMonthly), oeRows = otherExpNZ.map(rowMonthly);
    function totalsOf(rows){ return months.map((_,i)=>rows.reduce((s,r)=>s+r.vals[i],0)); }
    // totals use the FULL (unfiltered) account lists so hiding a zero-row never changes a total
    const totRevM = totalsOf(revenue.map(rowMonthly)), totCOSM = totalsOf(cos.map(rowMonthly)), totOIM = totalsOf(otherInc.map(rowMonthly)), totOEM = totalsOf(otherExp.map(rowMonthly));
    const grossProfitM = months.map((_,i)=>totRevM[i]-totCOSM[i]);
    const pbtM = months.map((_,i)=>grossProfitM[i]+totOIM[i]-totOEM[i]);
    const sumAll = arr=>arr.reduce((a,b)=>a+b,0);

    const headCols = months.map(monthLabel).concat(['Tot Actual']);
    function tblRow(label, vals, bold){
      const tot = sumAll(vals);
      return `<tr${bold?' style="font-weight:700;background:#eef3fa"':''}><td>${label}</td>${vals.map(v=>`<td class="right num">${fmt(v)}</td>`).join('')}<td class="right num">${fmt(tot)}</td></tr>`;
    }
    document.getElementById('isBody').innerHTML = `
      <div style="overflow-x:auto">
      <table style="min-width:1100px">
        <thead><tr><th>Account</th>${headCols.map(h=>`<th class="right">${h}</th>`).join('')}</tr></thead>
        <tbody>
          <tr style="background:#dbe6f5"><td colspan="${headCols.length+1}" style="font-weight:700">Revenue</td></tr>
          ${revRows.map(r=>tblRow(r.name, r.vals)).join('')}
          ${tblRow('Total Revenue', totRevM, true)}
          <tr style="background:#dbe6f5"><td colspan="${headCols.length+1}" style="font-weight:700">Cost of Sales</td></tr>
          ${cosRows.map(r=>tblRow(r.name, r.vals)).join('')}
          ${tblRow('Total Cost of Sales', totCOSM, true)}
          ${tblRow('Gross Profit', grossProfitM, true)}
          <tr style="background:#dbe6f5"><td colspan="${headCols.length+1}" style="font-weight:700">Other Income</td></tr>
          ${oiRows.map(r=>tblRow(r.name, r.vals)).join('')}
          ${tblRow('Total Other Income', totOIM, true)}
          <tr style="background:#dbe6f5"><td colspan="${headCols.length+1}" style="font-weight:700">Other Expense</td></tr>
          ${oeRows.map(r=>tblRow(r.name, r.vals)).join('')}
          ${tblRow('Total Other Expense', totOEM, true)}
          ${tblRow('Profit Before Tax', pbtM, true)}
        </tbody>
      </table>
      </div>
    `;
    document.getElementById('exPdf').onclick = ()=>{
      const header = ['Account', ...headCols];
      const rows = []; const rowStyles = {};
      const bar = (label)=>{ rows.push([label, ...Array(headCols.length).fill('')]); rowStyles[rows.length-1] = {fill:PDF_COLORS.lightBar, text:PDF_COLORS.navy, bold:true}; };
      const tot = (label, vals)=>{ rows.push([label, ...vals.map(fmt), fmt(sumAll(vals))]); rowStyles[rows.length-1] = {fill:PDF_COLORS.veryLightBar, text:PDF_COLORS.tx, bold:true}; };
      bar('Revenue');
      revRows.forEach(r=>rows.push([r.name, ...r.vals.map(fmt), fmt(r.tot)]));
      tot('Total Revenue', totRevM);
      bar('Cost of Sales');
      cosRows.forEach(r=>rows.push([r.name, ...r.vals.map(fmt), fmt(r.tot)]));
      tot('Total Cost of Sales', totCOSM);
      tot('Gross Profit', grossProfitM);
      bar('Other Income');
      oiRows.forEach(r=>rows.push([r.name, ...r.vals.map(fmt), fmt(r.tot)]));
      tot('Total Other Income', totOIM);
      bar('Other Expense');
      oeRows.forEach(r=>rows.push([r.name, ...r.vals.map(fmt), fmt(r.tot)]));
      tot('Total Other Expense', totOEM);
      tot('Profit Before Tax', pbtM);
      exportPDF('Statement of Comprehensive Income Year', CO().name+' — FY'+fy+' ('+fyLabel(fy)+')', header, rows, {landscape:true, rowStyles});
    };
    document.getElementById('exXls').onclick = ()=>{
      const header = ['Account', ...headCols];
      const rows = [];
      rows.push(['Revenue']);
      revRows.forEach(r=>rows.push([r.name, ...r.vals, r.tot]));
      rows.push(['Total Revenue', ...totRevM, sumAll(totRevM)]);
      rows.push(['Cost of Sales']);
      cosRows.forEach(r=>rows.push([r.name, ...r.vals, r.tot]));
      rows.push(['Total Cost of Sales', ...totCOSM, sumAll(totCOSM)]);
      rows.push(['Gross Profit', ...grossProfitM, sumAll(grossProfitM)]);
      rows.push(['Other Income']);
      oiRows.forEach(r=>rows.push([r.name, ...r.vals, r.tot]));
      rows.push(['Total Other Income', ...totOIM, sumAll(totOIM)]);
      rows.push(['Other Expense']);
      oeRows.forEach(r=>rows.push([r.name, ...r.vals, r.tot]));
      rows.push(['Total Other Expense', ...totOEM, sumAll(totOEM)]);
      rows.push(['Profit Before Tax', ...pbtM, sumAll(pbtM)]);
      exportExcel('Statement_of_Comprehensive_Income_Year.xlsx', 'Monthly', header, rows);
    };
  }
}

    <table><thead><tr><th>Name</th><th>Contact</th><th>Terms (days)</th><th class="right">Balance</th><th></th></tr></thead>
      <tbody>${CO().customers.map(c=>`<tr><td>${c.name}</td><td>${c.contact||''}</td><td class="num">${c.terms||30}</td><td class="right num">${fmt(customerBalance(c.id))}</td>
        <td class="right"><button class="btn ghost sm" data-editcust="${c.id}">Edit</button> <button class="btn ghost sm" data-delcust="${c.id}">Delete</button></td></tr>`).join('')}</tbody>
    </table>`}
  `;
  document.getElementById('addCust').onclick = ()=>{ ui.editPartyId=null; ui.modal='newCustomer'; renderModal(); };
  main.querySelectorAll('[data-editcust]').forEach(b=>b.onclick=()=>{ ui.editPartyId=b.dataset.editcust; ui.modal='newCustomer'; renderModal(); });
  main.querySelectorAll('[data-delcust]').forEach(b=>b.onclick=()=>{
    const id = b.dataset.delcust;
    const used = CO().salesInvoices.some(i=>i.customerId===id) || CO().creditNotes.some(c=>c.customerId===id) || CO().journal.some(je=>je.customerId===id);

  });
}

   RATIO ANALYSIS — computed live from posted data (no manual entry needed)
========================================================================= */
function computeRatiosFor(fyStart, asOf){
  const sumB = accts => accts.reduce((s,a)=>s+accountBalance(a.id, asOf),0);
  const assetsCurrent = CO().accounts.filter(a=>a.type==='Asset' && typeMeta(a.accountType).bsGroup==='Current Assets');
  const assetsNonCurrent = CO().accounts.filter(a=>a.type==='Asset' && typeMeta(a.accountType).bsGroup==='Non-Current Assets');
  const liabCurrent = CO().accounts.filter(a=>a.type==='Liability' && typeMeta(a.accountType).bsGroup==='Current Liabilities');
  const liabNonCurrent = CO().accounts.filter(a=>a.type==='Liability' && typeMeta(a.accountType).bsGroup==='Non-Current Liabilities');
  const equityAccts = CO().accounts.filter(a=>a.type==='Equity');
  const invAccts = CO().accounts.filter(a=>a.accountType==='Inventories');
  const cashAccts = CO().accounts.filter(a=>a.accountType==='Cash and Cash Equivalents');

  const totalCurrentAssets = sumB(assetsCurrent), totalNonCurrentAssets = sumB(assetsNonCurrent);
  const totalAssets = totalCurrentAssets + totalNonCurrentAssets;
  const totalCurrentLiab = sumB(liabCurrent), totalNonCurrentLiab = sumB(liabNonCurrent);
  const totalLiab = totalCurrentLiab + totalNonCurrentLiab;
  const income = CO().accounts.filter(a=>a.type==='Income').reduce((s,a)=>s+accountBalance(a.id,asOf),0);
  const expense = CO().accounts.filter(a=>a.type==='Expense').reduce((s,a)=>s+accountBalance(a.id,asOf),0);
  const netIncome = income - expense;
  const totalEquity = sumB(equityAccts) + netIncome;
  const inventory = sumB(invAccts), cash = sumB(cashAccts);

  const revenue = CO().accounts.filter(a=>a.accountType==='Revenue').reduce((s,a)=>s+accountMovement(a.id,fyStart,asOf),0);
  const cos = CO().accounts.filter(a=>a.accountType==='Cost of Sales').reduce((s,a)=>s+accountMovement(a.id,fyStart,asOf),0);
  const grossProfit = revenue - cos;
  const otherInc = CO().accounts.filter(a=>a.accountType==='Other Income').reduce((s,a)=>s+accountMovement(a.id,fyStart,asOf),0);
  const otherExp = CO().accounts.filter(a=>a.accountType==='Other Expense').reduce((s,a)=>s+accountMovement(a.id,fyStart,asOf),0);
  const pbt = grossProfit + otherInc - otherExp;

  const div = (n,d) => (!d) ? null : n/d;
  return {
    totalCurrentAssets, totalNonCurrentAssets, totalAssets, totalCurrentLiab, totalNonCurrentLiab, totalLiab, totalEquity, cash, inventory,
    revenue, cos, grossProfit, otherInc, otherExp, pbt,
    currentRatio: div(totalCurrentAssets, totalCurrentLiab),
    quickRatio: div(totalCurrentAssets-inventory, totalCurrentLiab),
    cashRatio: div(cash, totalCurrentLiab),
    workingCapital: totalCurrentAssets - totalCurrentLiab,
    grossMargin: div(grossProfit, revenue),
    netMargin: div(pbt, revenue),
    roa: div(pbt, totalAssets),
    roe: div(pbt, totalEquity),
    debtEquity: div(totalLiab, totalEquity),
    debtAssets: div(totalLiab, totalAssets),
    equityRatio: div(totalEquity, totalAssets),
  };
}
const RATIO_DEFS = [
  {key:'currentRatio', cat:'Liquidity', name:'Current Ratio', fmt:'x', meaning:"Current assets covering current liabilities. Below 1.00x means what's due soon exceeds what you could turn into cash soon.",
    status:v=>v==null?['N/M','warn']: v>=2?['Strong','good']: v>=1?['Adequate','good']:['Risk','bad']},
  {key:'quickRatio', cat:'Liquidity', name:'Quick Ratio (Acid-Test)', fmt:'x', meaning:"Same as Current Ratio but excludes inventory.",
    status:v=>v==null?['N/M','warn']: v>=1?['Strong','good']: v>=0.5?['Adequate','good']:['Risk','bad']},
  {key:'cashRatio', cat:'Liquidity', name:'Cash Ratio', fmt:'x', meaning:"The strictest liquidity test — cash alone against what's due soon.",
    status:v=>v==null?['N/M','warn']: v>=0.5?['Strong','good']: v>=0.2?['Adequate','good']:['Weak','bad']},
  {key:'workingCapital', cat:'Liquidity', name:'Working Capital', fmt:'R', meaning:"Rand-value cushion: current assets left over after covering current liabilities.",
    status:v=>v>=0?['Positive','good']:['Negative','bad']},
  {key:'grossMargin', cat:'Profitability', name:'Gross Profit Margin', fmt:'%', meaning:"How much of revenue is left after direct costs.",
    status:v=>v==null?['N/M','warn']: v>=0.2?['Strong','good']: v>=0.05?['Thin','warn']:['Critical','bad']},
  {key:'netMargin', cat:'Profitability', name:'Net Profit Margin', fmt:'%', meaning:"Profit before tax as a share of revenue — the true bottom line.",
    status:v=>v==null?['N/M','warn']: v>0?['Profitable','good']:['Loss-making','bad']},
  {key:'roa', cat:'Profitability', name:'Return on Assets (ROA)', fmt:'%', meaning:"How much profit the business generates from everything it owns.",
    status:v=>v==null?['N/M','warn']: v>0?['Positive','good']:['Negative','bad']},
  {key:'roe', cat:'Profitability', name:'Return on Equity (ROE)', fmt:'%', meaning:"Not meaningful while Total Equity is negative — see Equity Ratio instead.", negEquityNM:true,
    status:v=>v==null?['N/M','warn']: v>0?['Positive','good']:['Negative','bad']},
  {key:'debtEquity', cat:'Solvency', name:'Debt-to-Equity', fmt:'x', meaning:"Not meaningful while Total Equity is negative — see Equity Ratio instead.", negEquityNM:true,
    status:v=>v==null?['N/M','warn']: v<=1?['Conservative','good']: v<=2?['Moderate','warn']:['High','bad']},
  {key:'debtAssets', cat:'Solvency', name:'Debt-to-Assets', fmt:'%', meaning:"Share of everything the business owns that's funded by liabilities.",
    status:v=>v==null?['N/M','warn']: v<=0.5?['Conservative','good']: v<=0.8?['Moderate','warn']:['High','bad']},
  {key:'equityRatio', cat:'Solvency', name:'Equity Ratio', fmt:'%', meaning:"Share of assets funded by equity rather than debt. Negative means liabilities exceed assets.",
    status:v=>v==null?['N/M','warn']: v<0?['Insolvent (on paper)','bad']: v<0.3?['Thin','warn']:['Sound','good']},
];
function fmtRatio(v, kind){
  if(v==null || !isFinite(v)) return 'N/M';
  if(kind==='x') return fmt2(v)+'x';
  if(kind==='%') return (v*100).toFixed(1)+'%';
  return fmt(v);
}
function fmt2(v){ return v.toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ---- tiny inline SVG chart helpers (no external chart library needed) ---- */
function svgLineChart(series, labels, opts){
  opts = opts || {};
  const W=680, H=260, padL=48, padR=16, padT=16, padB=30;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const allVals = series.flatMap(s=>s.values).filter(v=>v!=null && isFinite(v));
  let lo = Math.min(0, ...allVals), hi = Math.max(...allVals, 0.01);
  if(hi===lo) hi = lo+1;
  const range = hi-lo;
  const x = i => padL + (labels.length<=1? plotW/2 : (plotW*i/(labels.length-1)));
  const y = v => padT + plotH - ((v-lo)/range)*plotH;
  const gridN = 4;
  let gridLines = '';
  for(let g=0; g<=gridN; g++){
    const gv = lo + (range*g/gridN);
    const gy = y(gv);
    gridLines += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#e7ecf3" stroke-width="1"/>`;
    gridLines += `<text x="${padL-6}" y="${gy+3}" font-size="9" fill="#8a94a3" text-anchor="end" font-family="Arial">${opts.pct? (gv*100).toFixed(0)+'%' : fmt2(gv)}</text>`;
  }
  let axisLabels = labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" font-size="9" fill="#8a94a3" text-anchor="middle" font-family="Arial">${l}</text>`).join('');
  let lines = '';
  let legend = '';
  series.forEach((s, si)=>{
    const pts = s.values.map((v,i)=> v==null? null : `${x(i)},${y(v)}`).filter(Boolean).join(' ');
    lines += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
    s.values.forEach((v,i)=>{ if(v!=null) lines += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.color}"/>`; });
    legend += `<circle cx="${padL + si*150}" cy="${H+16}" r="4" fill="${s.color}"/><text x="${padL+si*150+10}" y="${H+20}" font-size="10" fill="#1b2531" font-family="Arial">${s.name}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H+34}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${W}px;height:auto">
    ${gridLines}${lines}${axisLabels}${legend}
  </svg>`;
}
function svgBarChart(bars, opts){
  opts = opts || {};
  const W=680, H=230, padL=16, padR=16, padT=16, padB=34;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const vals = bars.map(b=>b.value);
  const hi = Math.max(...vals, 0.01), lo = Math.min(...vals, 0);
  const range = (hi-lo)||1;
  const zeroY = padT + plotH - ((0-lo)/range)*plotH;
  const bw = plotW/bars.length*0.5;
  let rects = '';
  bars.forEach((b,i)=>{
    const cx = padL + plotW*(i+0.5)/bars.length;
    const by = padT + plotH - ((b.value-lo)/range)*plotH;
    const top = Math.min(by, zeroY), h = Math.abs(by-zeroY);
    rects += `<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${Math.max(h,1)}" fill="${b.color}" rx="3"/>`;
    rects += `<text x="${cx}" y="${top-6}" font-size="10.5" fill="#1b2531" text-anchor="middle" font-family="Arial" font-weight="bold">${fmt(b.value)}</text>`;
    rects += `<text x="${cx}" y="${H-10}" font-size="10" fill="#5b6675" text-anchor="middle" font-family="Arial">${b.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${W}px;height:auto">
    <line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}" stroke="#d7dee8" stroke-width="1"/>
    ${rects}
  </svg>`;
}
function trailingMonths(asOf, n){
  const out = [];
  let cursor = new Date(asOf);
  for(let i=0;i<n;i++){
    const end = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0);
    out.unshift(localISO(end));
    cursor.setMonth(cursor.getMonth()-1);
  }
  return out;
}

function renderRatios(main){
  const mode = ui.ratioMode || 'fy';
  const fy = ui.ratioFY===undefined? currentFYEndYear() : ui.ratioFY;
  const customMonth = ui.ratioMonth || '';
  const today = todayISO();
  const [fyStart, fyEnd] = fyRange(fy);
  const asOf = mode==='custom'? (monthInputAsOf(customMonth) || today) : (fyEnd > today ? today : fyEnd);
  const asOfLabel = mode==='custom'? (customMonth? fmtDate(asOf) : 'Pick a month') : (fmtDate(asOf)+' (FY'+fy+')');

  const R = computeRatiosFor(fyStart, asOf);

  function rowsHTML(){
    const cats = ['Liquidity','Profitability','Solvency'];
    return cats.map(cat=>{
      const defs = RATIO_DEFS.filter(d=>d.cat===cat);
      return `<div class="statement-group">${cat}</div>` + defs.map(d=>{
        let val = R[d.key];
        let label, cls;
        if(d.negEquityNM && R.totalEquity < 0){ val = null; [label,cls] = ['Negative equity','warn']; }
        else { [label,cls] = d.status(val); }
        const color = cls==='good'?'var(--green)':cls==='bad'?'var(--red)':'var(--amber)';
        return `<div class="statement-row indent" style="align-items:center;gap:14px">
          <span style="flex:1 1 auto;min-width:0">${d.name}<br><span style="font-size:11px;color:var(--tx3)">${d.meaning}</span></span>
          <span class="num" style="flex:0 0 90px;text-align:right;font-weight:700">${fmtRatio(val, d.fmt)}</span>
          <span class="num" style="flex:0 0 150px;text-align:right;font-weight:700;color:${color}">${label}</span>
        </div>`;
      }).join('');
    }).join('');
  }

  // trailing 6-month trend data for the charts
  const months = trailingMonths(asOf, 6);
  const monthLabels = months.map(m=>new Date(m).toLocaleDateString('en-ZA',{month:'short',year:'2-digit'}));
  const trend = months.map(m=>computeRatiosFor(fyRange(fy)[0]<=m? fyRange(fy)[0] : fyStart, m));
  // use each month's own FY start so YTD margins reset correctly across a FY boundary
  const trendProper = months.map(m=>{
    const y = (new Date(m).getMonth()+1) <= (CO().yearEndMonth||2) ? new Date(m).getFullYear() : new Date(m).getFullYear()+1;
    const [s] = fyRange(y);
    return computeRatiosFor(s, m);
  });

  main.innerHTML = `
    <div class="pagehead"><div class="pagetitle">Ratio Analysis</div><div class="pagesub">Liquidity, profitability, and solvency — computed live from your posted books, no manual entry</div></div>
    <div class="toolbar">
      ${asOfModeToggleHTML('ratio')}
      ${mode==='custom'? `<input type="month" id="ratioMonth" value="${customMonth}" style="width:170px">` : fyInputHTML('ratioFYSel', fy, false)}
      <button class="linkbtn" id="exPdf"><span class="ic">P</span>Export PDF</button>
      <button class="linkbtn" id="exXls"><span class="ic">X</span>Export Excel</button>
    </div>
    <div class="card">${rowsHTML()}</div>

    <div class="pagehead" style="margin-top:20px"><div class="pagetitle" style="font-size:16px">Liquidity trend — trailing 6 months</div></div>
    <div class="card" id="chartLiquidity"></div>

    <div class="pagehead" style="margin-top:20px"><div class="pagetitle" style="font-size:16px">Profitability trend — trailing 6 months</div></div>
    <div class="card" id="chartProfitability"></div>

    <div class="pagehead" style="margin-top:20px"><div class="pagetitle" style="font-size:16px">Assets vs Liabilities vs Equity — ${fmtDate(asOf)}</div></div>
    <div class="card" id="chartSnapshot"></div>
  `;
  document.getElementById('chartLiquidity').innerHTML = svgLineChart([
    {name:'Current Ratio', color:'#1a5fb4', values:trendProper.map(t=>t.currentRatio)},
    {name:'Quick Ratio', color:'#c9a84c', values:trendProper.map(t=>t.quickRatio)},
    {name:'Cash Ratio', color:'#1e8e5a', values:trendProper.map(t=>t.cashRatio)},
  ], monthLabels, {});
  document.getElementById('chartProfitability').innerHTML = svgLineChart([
    {name:'Gross Margin', color:'#1a5fb4', values:trendProper.map(t=>t.grossMargin)},
    {name:'Net Margin', color:'#c0392b', values:trendProper.map(t=>t.netMargin)},
  ], monthLabels, {pct:true});
  document.getElementById('chartSnapshot').innerHTML = svgBarChart([
    {label:'Total Assets', value:R.totalAssets, color:'#1a5fb4'},
    {label:'Total Liabilities', value:R.totalLiab, color:'#c0392b'},
    {label:'Total Equity', value:R.totalEquity, color:'#c9a84c'},
  ], {});

  document.getElementById('ratioMode').onchange = e=>{ ui.ratioMode=e.target.value; renderRatios(main); };
  if(mode==='custom') document.getElementById('ratioMonth').onchange = e=>{ ui.ratioMonth=e.target.value; renderRatios(main); };
  else document.getElementById('ratioFYSel') && wireFYInput('ratioFYSel', false, v=>{ ui.ratioFY=v; renderRatios(main); });

  document.getElementById('exPdf').onclick = ()=> exportRatiosPDF(R, asOfLabel, monthLabels, trendProper);
  document.getElementById('exXls').onclick = ()=> exportRatiosExcel(R, asOfLabel);
}

function svgToPngDataURL(svgString, scale){
  return new Promise((resolve)=>{
    const svg64 = btoa(unescape(encodeURIComponent(svgString)));
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = function(){ resolve(null); };
    img.src = 'data:image/svg+xml;base64,'+svg64;
  });
}
async function exportRatiosPDF(R, asOfLabel, monthLabels, trendProper){
  const { jsPDF } = window.jspdf;
  const C = PDF_COLORS;
  const doc = new jsPDF();
  const pageW = doc.internal.pageSize.getWidth();
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...C.navy);
  doc.text(CO().name, 14, 16);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(...C.tx2);
  doc.text('Ratio Analysis', 14, 23);
  doc.setFontSize(9); doc.setTextColor(...C.tx3);
  doc.text('As of '+asOfLabel, 14, 29);
  doc.setDrawColor(...C.line); doc.line(14, 32, pageW-14, 32);

  const rows = [], rowStyles = {};
  const cats = ['Liquidity','Profitability','Solvency'];
  cats.forEach(cat=>{
    rows.push([cat,'','']); rowStyles[rows.length-1] = {fill:C.navy2, text:[255,255,255], bold:true};
    RATIO_DEFS.filter(d=>d.cat===cat).forEach(d=>{
      let val = R[d.key], label, cls;
      if(d.negEquityNM && R.totalEquity<0){ val=null; [label,cls]=['Negative equity','warn']; } else { [label,cls]=d.status(val); }
      rows.push([d.name, fmtRatio(val,d.fmt), label]);
    });
  });
  doc.autoTable({
    startY:36, head:[['Ratio','Result','Status']], body:rows,
    styles:{fontSize:8.5, cellPadding:2.8, textColor:C.tx, lineColor:[231,236,243], lineWidth:0.15}, theme:'grid',
    headStyles:{fillColor:C.veryLightBar, textColor:C.navy2, fontStyle:'bold'},
    margin:{left:14,right:14},
    didParseCell:(data)=>{ if(data.section==='body'){ const rs=rowStyles[data.row.index]; if(rs){ if(rs.fill) data.cell.styles.fillColor=rs.fill; if(rs.text) data.cell.styles.textColor=rs.text; if(rs.bold) data.cell.styles.fontStyle='bold'; } } },
  });

  let y = doc.lastAutoTable.finalY + 14;
  const liqSvg = svgLineChart([
    {name:'Current Ratio', color:'#1a5fb4', values:trendProper.map(t=>t.currentRatio)},
    {name:'Quick Ratio', color:'#c9a84c', values:trendProper.map(t=>t.quickRatio)},
    {name:'Cash Ratio', color:'#1e8e5a', values:trendProper.map(t=>t.cashRatio)},
  ], monthLabels, {});
  const profSvg = svgLineChart([
    {name:'Gross Margin', color:'#1a5fb4', values:trendProper.map(t=>t.grossMargin)},
    {name:'Net Margin', color:'#c0392b', values:trendProper.map(t=>t.netMargin)},
  ], monthLabels, {pct:true});
  const snapSvg = svgBarChart([
    {label:'Total Assets', value:R.totalAssets, color:'#1a5fb4'},
    {label:'Total Liabilities', value:R.totalLiab, color:'#c0392b'},
    {label:'Total Equity', value:R.totalEquity, color:'#c9a84c'},
  ], {});

  for(const [title, svg] of [['Liquidity trend — trailing 6 months', liqSvg], ['Profitability trend — trailing 6 months', profSvg], ['Assets vs Liabilities vs Equity', snapSvg]]){
    const png = await svgToPngDataURL(svg, 2);
    if(y > 240){ doc.addPage(); y = 20; }
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...C.navy);
    doc.text(title, 14, y);
    if(png) doc.addImage(png, 'PNG', 14, y+4, 180, 68);
    y += 80;
  }
  doc.save('Ratio_Analysis.pdf');
}

  if(mode==='custom') document.getElementById('ageMonth').onchange = e=>{ ui.ageMonth=e.target.value; renderAge(main); };
  else wireFYInput('ageFYSel', false, v=>{ ui.ageFY=v; renderAge(main); });
  document.getElementById('exPdf').onclick = ()=>{
    const header = [kind==='debtors'?'Customer':'Supplier','Current','30 Days','60 Days','90 Days','120+ Days','Total'];
    const body = rows.map(r=>[r.party.name, fmt(r.buckets.current), fmt(r.buckets.d30), fmt(r.buckets.d60), fmt(r.buckets.d90), fmt(r.buckets.d120), fmt(r.total)])
      .concat([['Total', fmt(totals.current), fmt(totals.d30), fmt(totals.d60), fmt(totals.d90), fmt(totals.d120), fmt(totals.total)]]);
    exportPDF('Age Analysis — '+(kind==='debtors'?'Debtors':'Creditors'), CO().name+' — '+asOfLabel, header, body,
      {rowStyles: {[body.length-1]: {text:PDF_COLORS.navy, bold:true}}});
  };
  document.getElementById('exXls').onclick = ()=>{
    const header = [kind==='debtors'?'Customer':'Supplier','Current','30 Days','60 Days','90 Days','120+ Days','Total'];
    const body = rows.map(r=>[r.party.name, r.buckets.current, r.buckets.d30, r.buckets.d60, r.buckets.d90, r.buckets.d120, r.total])
      .concat([['Total', totals.current, totals.d30, totals.d60, totals.d90, totals.d120, totals.total]]);
    exportExcel('Age_Analysis_'+kind+'.xlsx', 'Age Analysis', header, body);
  };
}

function renderModal(){
  if(!ui.modal) return;
  if(ui.modal==='newBatch'){ renderNewBatchModal(); return; }
  if(ui.modal==='switchCompany'){ renderSwitchCompanyModal(); return; }
  if(ui.modal==='batchProps'){ renderBatchPropsModal(); return; }
  if(ui.modal==='newCustomer'){ renderPartyModal('customer'); return; }
  if(ui.modal==='newSupplier'){ renderPartyModal('supplier'); return; }
  if(ui.modal==='newInvoice'){ renderInvoiceModal('invoice'); return; }
  if(ui.modal==='newCreditNote'){ renderInvoiceModal('creditnote'); return; }
  if(ui.modal==='newSupplierInvoice'){ renderInvoiceModal('supplierinvoice'); return; }
  if(ui.modal==='postSummary'){ renderPostSummaryModal(); return; }
  if(ui.modal==='newJournal'){ renderNewJournalModal(); return; }
  if(ui.modal==='reallocateGL'){ renderReallocateModal(); return; }
  if(ui.modal!=='newAccount') return;
  const existing = ui.editAccountId ? CO().accounts.find(a=>a.id===ui.editAccountId) : null;
  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = `
    <div class="modal">
      <h3>${existing? 'Edit account' : 'New account'}</h3>
      <div class="field"><label>Code</label><input type="text" id="nCode" value="${existing? existing.code : ''}" placeholder="e.g. 4620"></div>
      <div class="field"><label>Name</label><input type="text" id="nName" value="${existing? existing.name : ''}" placeholder="e.g. Office Supplies"></div>
      <div class="field"><label>Account Type</label>
        <select id="nAccountType">${ACCOUNT_TYPES_LIST.map(t=>`<option value="${t}" ${existing && existing.accountType===t?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div class="field"><label style="display:flex;align-items:center;gap:6px;font-weight:400"><input type="checkbox" id="nBank" style="width:auto" ${existing && existing.isBank?'checked':''}> Treat as a bank account even if not "Cash and Cash Equivalents" type</label></div>
      <div class="modalrow">
        <button class="btn ghost" id="cancelModal">Cancel</button>
        <button class="btn" id="saveModal">${existing? 'Save changes' : 'Add account'}</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(wrap);
  document.getElementById('cancelModal').onclick = ()=>{ ui.modal=null; ui.editAccountId=null; renderModal(); wrap.remove(); };
  document.getElementById('saveModal').onclick = ()=>{
    const code = document.getElementById('nCode').value.trim();
    const name = document.getElementById('nName').value.trim();
    const accountType = document.getElementById('nAccountType').value;
    const isBank = document.getElementById('nBank').checked;
    if(!code || !name){ alert('Code and name are required.'); return; }
    if(existing){
      existing.code = code; existing.name = name; existing.accountType = accountType; existing.isBank = isBank;
      applyAccountType(existing);
    } else {
      CO().accounts.push(applyAccountType({id:uid('a'), code, name, accountType, isBank}));
    }
    saveData(); ui.modal=null; ui.editAccountId=null; renderShell();
  };
}
function donutSVG(segments, size){
  size = size || 160;
  const r = size/2 - 10, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let offset = 0;
  const colors = ['#1a5fb4','#34a0f0','#1e8e5a','#f4b860','#c0392b','#7c5cbf','#0e9488','#c2570e'];
  const circles = segments.map((seg,i)=>{
    const frac = seg.value/total;
    const dash = frac*circ;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="26" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
    return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles||`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#dfe6f0" stroke-width="26"/>`}</svg>`;
}

function renderPostSummaryModal(){
  const toPost = CO().bankfeed.filter(t=>t.status==='allocated' && t.allocatedAccountId);
  const bankAccountIds = [...new Set(toPost.map(t=>t.bankAccountId))];
  const openingBal = bankAccountIds.reduce((s,id)=>s+accountBalance(id),0);
  const receipts = toPost.filter(t=>t.amount>=0).reduce((s,t)=>s+t.amount,0);
  const payments = toPost.filter(t=>t.amount<0).reduce((s,t)=>s-t.amount,0);
  const projected = openingBal + receipts - payments;

  const byAccount = {};
  toPost.forEach(t=>{
    const key = t.allocatedAccountId;
    byAccount[key] = (byAccount[key]||0) + Math.abs(t.amount);
  });
  const segments = Object.entries(byAccount).map(([id,val])=>({label: acct(id)? acct(id).name : id, value:val}));
  const colors = ['#1a5fb4','#34a0f0','#1e8e5a','#f4b860','#c0392b','#7c5cbf','#0e9488','#c2570e'];

  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = `
    <div class="modal" style="width:620px">
      <h3>Statement Summary — ${toPost.length} transaction${toPost.length===1?'':'s'} to post</h3>
      <div style="display:flex;gap:24px;flex-wrap:wrap">
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:8px">Transaction Allocation</div>
          ${donutSVG(segments)}
          <div style="margin-top:10px;display:flex;flex-direction:column;gap:4px">
            ${segments.map((s,i)=>`<div style="display:flex;align-items:center;gap:6px;font-size:11.5px"><span style="width:9px;height:9px;border-radius:2px;background:${colors[i%colors.length]};display:inline-block"></span>${s.label} <span class="num" style="margin-left:auto;color:var(--tx2)">${fmt(s.value)}</span></div>`).join('')}
          </div>
        </div>
        <div style="flex:1;min-width:220px">
          <div style="font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:8px">Summary</div>
          <div class="statement-row"><span>Opening bank balance</span><span class="num">${fmt(openingBal)}</span></div>
          <div class="statement-row"><span>Receipts (money in)</span><span class="num amt-in">${fmt(receipts)}</span></div>
          <div class="statement-row"><span>Payments (money out)</span><span class="num amt-out">${fmt(-payments)}</span></div>
          <div class="statement-row total"><span>Projected closing balance</span><span class="num">${fmt(projected)}</span></div>
        </div>
      </div>
      <div class="modalrow">
        <button class="btn ghost" id="cancelPS">Cancel</button>
        <button class="btn" id="continuePS">✓ Continue — post to ledger</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(wrap);
  document.getElementById('cancelPS').onclick = ()=>{ ui.modal=null; wrap.remove(); };
  document.getElementById('continuePS').onclick = ()=>{
    postAllocated();
    ui.modal=null; wrap.remove();
    if(ui.postSummaryReturn) ui.postSummaryReturn();
    renderShell();
  };
}

function renderReallocateModal(){
  const je = CO().journal.find(j=>j.id===ui.reallocateJeId);
  const currentAcctId = ui.reallocateCurrentAcct;
  if(!je){ ui.modal=null; return; }
  // We reallocate the line for the account you're currently viewing (e.g. Purchases),
  // not the other side of the entry — so it doesn't matter that the other side is a bank account.
  const myLine = je.lines.find(l=>l.accountId===currentAcctId);
  const otherLine = je.lines.find(l=>l!==myLine);
  const amt = myLine.debit || myLine.credit;
  const myAcct = acct(currentAcctId);

  const options = CO().accounts.filter(a=>a.id!==otherLine.accountId).slice().sort((a,b)=>a.code.localeCompare(b.code));
  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = `
    <div class="modal">
      <h3>Reallocate transaction</h3>
      <div class="hint" style="margin-bottom:12px">${fmtDate(je.date)} — ${je.description}</div>
      <div class="field"><label>Currently allocated to</label><div style="padding:7px 9px;background:var(--panel2);border-radius:6px;font-size:12.5px">${myAcct? myAcct.code+' — '+myAcct.name : currentAcctId} (${fmt(amt)})</div></div>
      <div class="field"><label>Reallocate to</label>
        <select id="raAcct">${options.map(a=>`<option value="${a.id}" ${a.id===currentAcctId?'selected':''}>${a.code} — ${a.name}</option>`).join('')}</select>
      </div>
      <div class="modalrow"><button class="btn ghost" id="cancelRA">Cancel</button><button class="btn" id="saveRA">Save reallocation</button></div>
    </div>`;
  document.getElementById('app').appendChild(wrap);
  document.getElementById('cancelRA').onclick = ()=>{ ui.modal=null; ui.reallocateJeId=null; renderModal(); wrap.remove(); };
  document.getElementById('saveRA').onclick = ()=>{
    const newAcctId = document.getElementById('raAcct').value;
    myLine.accountId = newAcctId;
    // keep the linked bank transaction (if any) in sync so Allocate & Post shows the same account.
    // Whichever side this line represented on the bank feed record, follow it to the new account.
    if(je.bankTxnId){
      const t = CO().bankfeed.find(x=>x.id===je.bankTxnId);
      if(t){
        if(t.allocatedAccountId === currentAcctId){
          t.allocatedAccountId = newAcctId;
          t.allocatedCustomerId = (newAcctId===AR_ACCOUNT) ? t.allocatedCustomerId : null;
          t.allocatedSupplierId = (newAcctId===AP_ACCOUNT) ? t.allocatedSupplierId : null;
        } else if(t.bankAccountId === currentAcctId){
          t.bankAccountId = newAcctId;
        }
      }
    }
    saveData();
    ui.modal=null; ui.reallocateJeId=null;
    renderShell();
  };
}

function renderPartyModal(kind){
  const isCust = kind==='customer';
  const list = isCust? CO().customers : CO().suppliers;
  const existing = ui.editPartyId? list.find(p=>p.id===ui.editPartyId) : null;
  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = `
    <div class="modal">
      <h3>${existing? 'Edit '+(isCust?'Customer':'Supplier') : 'New '+(isCust?'Customer':'Supplier')}</h3>
      <div class="field"><label>Name</label><input type="text" id="pName" value="${existing?existing.name:''}"></div>
      <div class="field"><label>Contact (email/phone)</label><input type="text" id="pContact" value="${existing?(existing.contact||''):''}"></div>
      <div class="field"><label>Payment terms (days)</label><input type="number" id="pTerms" value="${existing?(existing.terms||30):30}"></div>
      <div class="modalrow"><button class="btn ghost" id="cancelP">Cancel</button><button class="btn" id="saveP">${existing?'Save changes':'Add '+(isCust?'customer':'supplier')}</button></div>
    </div>`;
  document.getElementById('app').appendChild(wrap);
  document.getElementById('cancelP').onclick = ()=>{ ui.modal=null; ui.editPartyId=null; renderModal(); wrap.remove(); };
  document.getElementById('saveP').onclick = ()=>{
    const name = document.getElementById('pName').value.trim();
    if(!name){ alert('Name is required.'); return; }
    if(existing){
      existing.name = name; existing.contact = document.getElementById('pContact').value.trim(); existing.terms = parseInt(document.getElementById('pTerms').value)||30;
    } else {
      const rec = {id:uid(isCust?'cust':'supp'), name, contact:document.getElementById('pContact').value.trim(), terms: parseInt(document.getElementById('pTerms').value)||30};
      if(isCust) CO().customers.push(rec); else CO().suppliers.push(rec);
    }
    saveData(); ui.modal=null; ui.editPartyId=null; renderShell();
  };
}

function renderInvoiceModal(kind){
  const isInv = kind==='invoice', isCN = kind==='creditnote', isSI = kind==='supplierinvoice';
  const editId = isInv? ui.editInvoiceId : isCN? ui.editCreditNoteId : ui.editSupplierInvoiceId;
  const list = isInv? CO().salesInvoices : isCN? CO().creditNotes : CO().supplierInvoices;
  const existing = editId? list.find(x=>x.id===editId) : null;
  const title = (existing?'Edit ':'New ') + (isInv? 'Sales Invoice' : isCN? 'Credit Note' : 'Supplier Invoice');
  const parties = isSI? CO().suppliers : CO().customers;
  const partyLabel = isSI? 'Supplier' : 'Customer';
  const existingPartyId = existing? (isSI? existing.supplierId : existing.customerId) : null;
  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = `
    <div class="modal">
      <h3>${title}</h3>
      <div class="field"><label>${partyLabel}</label><select id="iParty">${parties.map(p=>`<option value="${p.id}" ${existingPartyId===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div>
      <div class="field"><label>Date</label><input type="date" id="iDate" value="${existing? existing.date : todayISO()}"></div>
      <div class="field"><label>Description</label><input type="text" id="iDesc" value="${existing?(existing.desc||''):''}" placeholder="e.g. Consulting services — July"></div>
      ${isSI? `<div class="field"><label>Expense account</label><select id="iExpAcct">${CO().accounts.filter(a=>a.type==='Expense').map(a=>`<option value="${a.id}" ${existing? existing.expenseAccountId===a.id : a.id==='a2100'?'selected':''}>${a.code} — ${a.name}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label>Total (VAT inclusive)</label><input type="number" id="iTotal" step="0.01" value="${existing?existing.total:''}" placeholder="0.00"></div>
      <div class="field"><label>VAT % (0 if not VAT registered)</label><input type="number" id="iVat" value="${existing? existing.vatPct : 15}" step="0.01"></div>
      <div class="modalrow">
        ${existing? `<button class="btn danger" id="delI" style="margin-right:auto">Delete</button>`:''}
        <button class="btn ghost" id="cancelI">Cancel</button>
        <button class="btn" id="saveI">${existing? 'Save changes' : (isCN?'Post credit note':'Post invoice')}</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(wrap);
  document.getElementById('cancelI').onclick = ()=>{ ui.modal=null; renderModal(); wrap.remove(); };
  const jeKey = isInv? 'invoiceId' : isCN? 'creditNoteId' : 'supplierInvoiceId';
  const delBtn = document.getElementById('delI');
  if(delBtn) delBtn.onclick = ()=>{
    if(!confirm('Delete this '+(isInv?'invoice':isCN?'credit note':'supplier invoice')+'? This removes its posted journal entry too.')) return;
    removeJournalFor(jeKey, existing.id);
    if(isInv) CO().salesInvoices = CO().salesInvoices.filter(x=>x.id!==existing.id);
    else if(isCN) CO().creditNotes = CO().creditNotes.filter(x=>x.id!==existing.id);
    else CO().supplierInvoices = CO().supplierInvoices.filter(x=>x.id!==existing.id);
    saveData(); ui.modal=null; ui.tab = isInv?'invoices':isCN?'creditnotes':'supplierinvoices'; renderShell();
  };
  document.getElementById('saveI').onclick = ()=>{
    const partyId = document.getElementById('iParty').value;
    const date = document.getElementById('iDate').value;
    const desc = document.getElementById('iDesc').value.trim();
    const total = parseFloat(document.getElementById('iTotal').value)||0;
    const vatPct = parseFloat(document.getElementById('iVat').value)||0;
    if(!partyId || !total){ alert('Please choose a '+partyLabel.toLowerCase()+' and enter a total.'); return; }
    if(existing){
      removeJournalFor(jeKey, existing.id);
      if(isInv){ existing.customerId=partyId; existing.date=date; existing.desc=desc; existing.total=total; existing.vatPct=vatPct; postSalesInvoice(existing); }
      else if(isCN){ existing.customerId=partyId; existing.date=date; existing.desc=desc; existing.total=total; existing.vatPct=vatPct; postCreditNote(existing); }
      else { existing.supplierId=partyId; existing.date=date; existing.desc=desc; existing.total=total; existing.vatPct=vatPct; existing.expenseAccountId=document.getElementById('iExpAcct').value; postSupplierInvoice(existing); }
    } else if(isInv){
      CO().invoiceSeq = (CO().invoiceSeq||0)+1;
      const inv = {id:uid('inv'), no:'INV'+String(CO().invoiceSeq).padStart(4,'0'), customerId:partyId, date, desc, total, vatPct};
      CO().salesInvoices.push(inv); postSalesInvoice(inv);
    } else if(isCN){
      CO().creditNoteSeq = (CO().creditNoteSeq||0)+1;
      const cn = {id:uid('cn'), no:'CN'+String(CO().creditNoteSeq).padStart(4,'0'), customerId:partyId, date, desc, total, vatPct};
      CO().creditNotes.push(cn); postCreditNote(cn);
    } else {
      const expenseAccountId = document.getElementById('iExpAcct').value;
      CO().supplierInvoiceSeq = (CO().supplierInvoiceSeq||0)+1;
      const inv = {id:uid('sinv'), no:'SI'+String(CO().supplierInvoiceSeq).padStart(4,'0'), supplierId:partyId, date, desc, total, vatPct, expenseAccountId};
      CO().supplierInvoices.push(inv); postSupplierInvoice(inv);
    }
    saveData(); ui.modal=null; ui.tab = isInv?'invoices':isCN?'creditnotes':'supplierinvoices'; renderShell();
  };
}

  if(fb.ready){
    cloudPull(cloudData=>{
      if(cloudData && (!state.companies.length || (cloudData.nextId||0) > (state.nextId||0))){
        state = cloudData;
      }
      renderRoot();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledgerline — Bookkeeping</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<style>
  :root{
    --bg:#eef1f6; --panel:#ffffff; --line:#d7dee8; --line2:#e7ecf3;
    --navy:#1f3a5f; --navy2:#274a75; --blue:#1a5fb4; --blue-bg:#eaf1fb; --blue-sel:#2f6fbf;
    --tx:#1b2531; --tx2:#5b6675; --tx3:#8a94a3;
    --green:#1e8e5a; --red:#c0392b; --amber:#b8860b;
    --sans:'Segoe UI',Tahoma,Arial,sans-serif; --mono:Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--tx); font-family:var(--sans); font-size:13px;}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#c3ccd9; border-radius:5px;}

  /* ---------- LOGIN / SETUP SCREENS ---------- */
  .authwrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#eef1f6,#dbe3ee);}
  .authbox{background:var(--panel); border:1px solid var(--line); border-radius:6px; box-shadow:0 10px 34px rgba(20,30,50,.14); width:360px; padding:30px 28px;}
  .authlogo{display:flex; align-items:center; gap:9px; margin-bottom:18px;}
  .authlogo .sq{width:30px; height:30px; background:var(--navy); border-radius:5px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;}
  .authlogo .name{font-size:18px; font-weight:600;}
  .authlogo .name em{font-style:normal; color:var(--blue);}
  .authtitle{font-size:14px; font-weight:600; margin-bottom:4px;}
  .authsub{font-size:12px; color:var(--tx2); margin-bottom:18px;}
  .authfield{margin-bottom:13px;}
  .authfield label{font-size:11.5px; color:var(--tx2); display:block; margin-bottom:4px;}
  .authfield input{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:4px; font-size:13px; font-family:var(--sans);}
  .authfield input:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-bg);}
  .autherr{background:#fbeaea; border:1px solid #e6b8b3; color:var(--red); font-size:12px; padding:8px 10px; border-radius:4px; margin-bottom:12px;}
  .authbtn{width:100%; background:var(--blue); color:#fff; border:none; padding:10px; border-radius:4px; font-weight:600; font-size:13px; cursor:pointer; margin-top:4px;}
  .authbtn:hover{background:#164e97;}
  .authswitch{text-align:center; font-size:12px; color:var(--tx2); margin-top:14px;}
  .authtabs{display:flex; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:3px; margin-bottom:20px;}
  .authtab{flex:1; padding:8px; border:none; background:transparent; border-radius:4px; font-size:12.5px; font-weight:600; color:var(--tx2); cursor:pointer; font-family:var(--sans);}
  .authtab.active{background:var(--panel); color:var(--blue); box-shadow:0 1px 3px rgba(20,30,50,.12);}
  .authtab:hover:not(.active){color:var(--tx);}
  .authswitch a{color:var(--blue); cursor:pointer; text-decoration:none;}
  .authswitch a:hover{text-decoration:underline;}

  /* ---------- APP CHROME ---------- */
  #shell{display:flex; flex-direction:column; height:100vh;}
  .topbar{height:48px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 14px; gap:14px; flex-shrink:0;}
  .topbar .logo{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px;}
  .topbar .logo .sq{width:24px; height:24px; background:var(--navy); border-radius:4px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px;}
  .topbar .logo em{font-style:normal; color:var(--blue);}
  .companypick{display:flex; align-items:center; gap:6px; background:var(--blue-bg); border:1px solid #cfe0f7; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:12.5px; color:var(--navy2); font-weight:600;}
  .companypick:hover{background:#dcebfa;}
  .topbar .spacer{flex:1;}
  .menurow{height:26px; background:#f6f8fb; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 14px; gap:16px; font-size:12px; color:var(--tx2); flex-shrink:0;}
  .menurow span{cursor:pointer; padding:2px 4px;}
  .menurow span:hover{color:var(--blue);}
  .userbit{font-size:12px; color:var(--tx2); display:flex; align-items:center; gap:8px;}
  .logoutbtn{font-size:12px; color:var(--blue); cursor:pointer; background:none; border:none; font-family:var(--sans);}
  .logoutbtn:hover{text-decoration:underline;}

  #body{display:flex; flex:1; min-height:0;}
  .side{width:238px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:10px 0;}
  .treesec{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--tx3); padding:12px 16px 4px; font-weight:700;}
  .treeitem{padding:7px 16px 7px 22px; font-size:12.5px; color:var(--navy2); cursor:pointer; display:flex; align-items:center; justify-content:space-between; border-left:3px solid transparent; position:relative;}
  .treeitem:before{content:''; width:6px; height:6px; border-radius:50%; background:#b7c3d4; position:absolute; left:9px; top:12px;}
  .treeitem:hover{background:#f2f6fb;}
  .treeitem.active{background:var(--blue-bg); border-left-color:var(--blue); color:var(--blue); font-weight:600;}
  .treeitem.active:before{background:var(--blue);}
  .treeitem .badge{background:var(--red); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:9px;}

  .main{flex:1; overflow-y:auto; padding:0; display:flex; flex-direction:column; min-width:0;}
  .tabstrip{background:#f6f8fb; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 10px; height:32px; flex-shrink:0;}
  .tabchip{background:var(--panel); border:1px solid var(--line); border-bottom:none; padding:5px 14px; font-size:12px; border-radius:5px 5px 0 0; margin-top:5px; color:var(--tx); font-weight:600; display:flex; align-items:center; gap:7px;}
  .tabchip .dot{width:7px; height:7px; border-radius:50%; background:var(--blue);}

  .content{padding:18px 24px 40px;}
  .pagehead{margin-bottom:2px;}
  .pagetitle{font-size:16px; font-weight:700; color:var(--tx);}
  .pagesub{color:var(--tx2); font-size:12px; margin-top:2px; margin-bottom:12px;}

  .gridtoolbar{display:flex; align-items:center; gap:0; margin:10px 0 14px; flex-wrap:wrap; border-bottom:1px solid var(--line2); padding-bottom:10px;}
  .linkbtn{display:flex; align-items:center; gap:6px; color:var(--blue); font-size:12.5px; font-weight:600; cursor:pointer; padding:4px 12px; border-right:1px solid var(--line2); background:none; border-top:none;border-left:none;border-bottom:none; font-family:var(--sans);}
  .linkbtn:first-child{padding-left:0;}
  .linkbtn:hover{text-decoration:underline;}
  .linkbtn:disabled{color:var(--tx3); cursor:not-allowed; text-decoration:none;}
  .linkbtn .ic{width:14px; height:14px; border-radius:3px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;}
  .linkbtn.del .ic{background:var(--red);}

  .btn{background:var(--blue); color:#fff; border:1px solid #144d92; padding:8px 16px; border-radius:4px; font-weight:600; font-size:12.5px; cursor:pointer; font-family:var(--sans);}
  .btn:hover{background:#164e97;}
  .btn.ghost{background:var(--panel); border:1px solid var(--line); color:var(--tx);}
  .btn.ghost:hover{border-color:var(--blue); color:var(--blue);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.sm{padding:5px 11px; font-size:11.5px; border-radius:3px;}

  .grid{display:grid; gap:12px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:16px;}
  .kpi-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--tx3); margin-bottom:8px; font-weight:700;}
  .kpi-val{font-family:var(--mono); font-size:21px; font-weight:700; color:var(--navy);}
  .kpi-sub{font-size:11.5px; color:var(--tx2); margin-top:4px;}

  table{width:100%; border-collapse:collapse; background:var(--panel);}
  thead th{text-align:left; font-size:11px; color:var(--navy2); padding:8px 10px; background:#eef3fa; border:1px solid var(--line); font-weight:700; cursor:pointer; user-select:none; white-space:nowrap;}
  thead th:hover{background:#e2ebf7;}
  td{padding:7px 10px; border:1px solid var(--line2); font-size:12.5px; vertical-align:middle;}
  tbody tr:hover td{background:#f5f8fc;}
  tbody tr.sel td{background:var(--blue-sel)!important; color:#fff;}
  .right{text-align:right;}
  .center{text-align:center;}
  .tag{font-size:10px; padding:2px 7px; border-radius:3px; font-weight:700; display:inline-block; text-transform:uppercase; letter-spacing:.03em;}
  .tag.unalloc{background:#fdf1de; color:var(--amber); border:1px solid #f0dcb0;}
  .tag.alloc{background:#e6f0fb; color:var(--blue); border:1px solid #c7dcf5;}
  .tag.posted{background:#e5f4ec; color:var(--green); border:1px solid #bfe3cf;}
  .tag.recon{background:#e5f4ec; color:var(--green); border:1px solid #bfe3cf;}
  .tag.unrecon{background:#fdf1de; color:var(--amber); border:1px solid #f0dcb0;}
  .amt-in{color:var(--green);} .amt-out{color:var(--red);}

  select,input[type=text],input[type=date],input[type=number],input[type=password],textarea{
    background:#fff; border:1px solid var(--line); color:var(--tx); padding:6px 9px; border-radius:4px; font-family:var(--sans); font-size:12.5px; width:100%;
  }
  select:focus,input:focus,textarea:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-bg);}
  label{font-size:11px; color:var(--tx2); display:block; margin-bottom:4px; font-weight:600;}
  .field{margin-bottom:12px;}

  .empty{text-align:center; padding:44px 20px; color:var(--tx3); background:var(--panel); border:1px solid var(--line); border-radius:5px;}
  .empty .big{font-size:14px; color:var(--tx2); margin-bottom:6px; font-weight:600;}

  .overlay{position:fixed; inset:0; background:rgba(20,28,42,.45); display:flex; align-items:center; justify-content:center; z-index:60;}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:22px; width:440px; max-width:92vw; max-height:86vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal h3{font-size:15px; margin-bottom:14px; font-weight:700; border-bottom:1px solid var(--line2); padding-bottom:10px;}
  .modalrow{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}

  .drop{border:1.5px dashed var(--line); border-radius:6px; padding:26px; text-align:center; color:var(--tx2); cursor:pointer; background:#fafbfd;}
  .drop:hover, .drop.drag{border-color:var(--blue); background:var(--blue-bg); color:var(--blue);}
  .drop input{display:none;}
  .hint{font-size:11px; color:var(--tx3); margin-top:6px;}

  .statement-row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line2); font-size:12.5px;}
  .statement-row.total{border-top:1.5px solid var(--navy); border-bottom:none; font-weight:700; padding-top:9px; margin-top:2px;}
  .statement-group{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#fff; background:var(--navy2); margin:16px 0 4px; padding:5px 9px; font-weight:700; border-radius:3px;}
  .statement-group:first-child{margin-top:0;}
  .indent{padding-left:12px; color:var(--tx2);}

  .statusbar{height:26px; background:var(--navy); color:#dbe6f2; display:flex; align-items:center; padding:0 12px; font-size:11.5px; gap:16px; flex-shrink:0;}
  .statusbar .seg{display:flex; align-items:center; gap:6px; border-right:1px solid #3a5c85; padding-right:16px;}
  .statusbar .seg:last-child{border-right:none; margin-left:auto; padding-right:0;}
  .statusbar .ic{opacity:.8;}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
  .toolbar select, .toolbar input{width:auto; min-width:140px;}

  @media(max-width:900px){
    .side{width:170px;}
    .g4,.g2{grid-template-columns:1fr 1fr;}
    .content{padding:14px;}
  }
</style>
</head>

<script>
/* =========================================================================
   STORAGE  (local, always-on) + FIREBASE (optional cloud sync)
========================================================================= */
const STORE_KEY='ledgerline_data_v3';

// ---- Fill this in with your Firebase project's web config to enable cloud
// sync (Firebase console -> Project settings -> your web app -> SDK setup).
// Leave apiKey blank to run local-only (localStorage), exactly like before.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAz9BYga72Ljd5Csi84S_EzTL4y5Q6ZSfY",
  databaseURL: "https://mshengu-crm-default-rtdb.firebaseio.com",
};
const FIREBASE_NODE = 'ledgerline_data';
let fb = { app:null, db:null, ready:false, syncing:false, lastSyncAt:null };

function initFirebase(done){
  if(!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.databaseURL){ done(); return; }
  try{
    fb.app = firebase.initializeApp(FIREBASE_CONFIG);
    fb.db = firebase.database();
    // Ledgerline's own login is local-only, so it signs in anonymously to Firebase
    // just so the database's security rules see an authenticated client.
    firebase.auth().signInAnonymously()
      .then(()=>{ fb.ready = true; done(); })
      .catch(e=>{ console.error('Firebase anonymous sign-in failed, continuing local-only', e); fb.ready=false; done(); });
  }catch(e){ console.error('Firebase init failed, continuing local-only', e); fb.ready=false; done(); }
}
function cloudPull(cb){
  if(!fb.ready){ cb(null); return; }
  try{
    fb.db.ref(FIREBASE_NODE).once('value').then(snap=>{ cb(snap.exists()? snap.val() : null); }).catch(e=>{ console.error('cloud pull failed', e); cb(null); });
  }catch(e){ console.error(e); cb(null); }
}
function cloudPush(){
  if(!fb.ready) return;
  try{
    fb.syncing = true;
    fb.db.ref(FIREBASE_NODE).set(state).then(()=>{ fb.syncing=false; fb.lastSyncAt=new Date(); updateSyncIndicator(); }).catch(e=>{ console.error('cloud push failed', e); fb.syncing=false; updateSyncIndicator(); });
  }catch(e){ console.error(e); fb.syncing=false; }
}
function updateSyncIndicator(){
  const el = document.getElementById('syncSeg');
  if(!el) return;
  if(!fb.ready){ el.innerHTML = `<span class="ic">💾</span>Local storage only`; return; }
  el.innerHTML = fb.syncing ? `<span class="ic">☁</span>Syncing…` : `<span class="ic">☁</span>Synced${fb.lastSyncAt? ' '+fb.lastSyncAt.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}) : ''}`;
}

function loadData(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveData(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ console.error('save failed', e); }
  cloudPush();
}

/* Sage-style account type taxonomy: each account carries a specific
   accountType (e.g. "Trade Receivables", "Cash and Cash Equivalents");
   `type` (Asset/Liability/Equity/Income/Expense) and the statement
   grouping are always derived from it via ACCOUNT_TYPE_META. */
const ACCOUNT_TYPE_META = {
  'Revenue':                      {type:'Income',   isGroup:'Revenue'},
  'Cost of Sales':                {type:'Expense',  isGroup:'Cost of Sales'},
  'Other Income':                 {type:'Income',   isGroup:'Other Income'},
  'Other Expense':                {type:'Expense',  isGroup:'Other Expense'},
  'Tax Expense':                  {type:'Expense',  isGroup:'Tax Expense'},
  'Share Capital':                {type:'Equity',   bsGroup:'Equity'},
  'Retained Earnings':            {type:'Equity',   bsGroup:'Equity'},
  'Other Current Liability':      {type:'Liability',bsGroup:'Current Liabilities'},
  'Non Current Liability':        {type:'Liability',bsGroup:'Non-Current Liabilities'},
  'Other Non Current Liability':  {type:'Liability',bsGroup:'Non-Current Liabilities'},
  'Property, Plant and Equipment':{type:'Asset',    bsGroup:'Non-Current Assets'},
  'Other Current Asset':          {type:'Asset',    bsGroup:'Current Assets'},
  'Trade Receivables':            {type:'Asset',    bsGroup:'Current Assets'},
  'Inventories':                  {type:'Asset',    bsGroup:'Current Assets'},
  'Cash and Cash Equivalents':    {type:'Asset',    bsGroup:'Current Assets'},
  'Trade Payables':               {type:'Liability',bsGroup:'Current Liabilities'},
  'Taxation Liability':           {type:'Liability',bsGroup:'Current Liabilities'},
};
const ACCOUNT_TYPES_LIST = Object.keys(ACCOUNT_TYPE_META);
function typeMeta(accountType){ return ACCOUNT_TYPE_META[accountType] || {type:'Asset'}; }
function applyAccountType(a){ a.type = typeMeta(a.accountType).type; return a; }

function uid(prefix){ return prefix + (state.nextId++); }
function CO(){ return ensureCompanyShape(state.companies.find(c=>c.id===state.activeCompanyId)) || null; }
function createCompany(name){
  const co = { id:uid('co'), name, createdAt:new Date().toISOString().slice(0,10),
    accounts:seedAccounts(), bankfeed:[], journal:[], statements:[], batchSeq:0,
    customers:[], suppliers:[], salesInvoices:[], creditNotes:[], supplierInvoices:[],
    invoiceSeq:0, creditNoteSeq:0, supplierInvoiceSeq:0 };
  state.companies.push(co);
  state.activeCompanyId = co.id;
  saveData();
  return co;
}
// backfill fields for companies created before this feature existed
function ensureCompanyShape(co){
  if(!co) return co;
  co.customers = co.customers || [];
  co.suppliers = co.suppliers || [];
  co.salesInvoices = co.salesInvoices || [];
  co.creditNotes = co.creditNotes || [];
  co.supplierInvoices = co.supplierInvoices || [];
  co.invoiceSeq = co.invoiceSeq || 0;
  co.creditNoteSeq = co.creditNoteSeq || 0;
  co.supplierInvoiceSeq = co.supplierInvoiceSeq || 0;
  co.journalSeq = co.journalSeq || 0;
  co.yearEndMonth = co.yearEndMonth || 2; // Feb, matches Sage sample default; editable in Company Details
  co.regNumber = co.regNumber || '';
  (co.accounts||[]).forEach(a=>{
    if(a.accountType){ applyAccountType(a); return; }
    // migrate accounts created before the Sage-style taxonomy existed
    if(a.isBank){ a.accountType = 'Cash and Cash Equivalents'; }
    else if(a.type==='Asset') a.accountType = a.subtype==='Non-Current' ? 'Property, Plant and Equipment' : 'Other Current Asset';
    else if(a.type==='Liability') a.accountType = a.subtype==='Non-Current' ? 'Non Current Liability' : 'Other Current Liability';
    else if(a.type==='Equity') a.accountType = 'Retained Earnings';
    else if(a.type==='Income') a.accountType = a.subtype==='Revenue' ? 'Revenue' : 'Other Income';
    else if(a.type==='Expense') a.accountType = a.subtype==='Cost of Sales' ? 'Cost of Sales' : 'Other Expense';
    else a.accountType = 'Other Current Asset';
    applyAccountType(a);
  });
  return co;
}

function fmt(n){
  const v = Math.round((n||0)*100)/100;
  const neg = v < 0;
  const s = Math.abs(v).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg? '-R ':'R ') + s;
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'});
}
function acct(id){ return CO().accounts.find(a=>a.id===id); }
function normalIsDebit(type){ return type==='Asset' || type==='Expense'; }

function accountBalance(accountId, asOf){
  let debit=0, credit=0;
  for(const je of CO().journal){
    if(asOf && je.date > asOf) continue;
    for(const l of je.lines){ if(l.accountId===accountId){ debit+=l.debit||0; credit+=l.credit||0; } }
  }
  const a = acct(accountId);
  const normal = a? normalIsDebit(a.type) : true;
  return normal ? (debit-credit) : (credit-debit);
}
function accountMovement(accountId, start, end){
  let debit=0, credit=0;
  for(const je of CO().journal){
    if(start && je.date < start) continue;
    if(end && je.date > end) continue;
    for(const l of je.lines){ if(l.accountId===accountId){ debit+=l.debit||0; credit+=l.credit||0; } }
  }
  const a = acct(accountId);
  const normal = a? normalIsDebit(a.type) : true;
  return normal ? (debit-credit) : (credit-debit);
}

/* ---------- AR / AP: customers, suppliers, invoices, credit notes ---------- */
const AR_ACCOUNT = 'a7100'; // Receivables Control
const AP_ACCOUNT = 'a9100'; // Payables Control
const VAT_ACCOUNT = 'a9600'; // Vat Control
const SALES_ACCOUNT = 'a1000'; // Sales

function postSalesInvoice(inv){
  const vat = round2((inv.total||0) * (inv.vatPct||0) / (100+ (inv.vatPct||0)) ); // VAT portion if total is VAT-inclusive
  const net = round2(inv.total - vat);
  const lines = [{accountId:AR_ACCOUNT, debit:inv.total, credit:0}, {accountId:SALES_ACCOUNT, debit:0, credit:net}];
  if(vat>0) lines.push({accountId:VAT_ACCOUNT, debit:0, credit:vat});
  const je = { id:uid('je'), date:inv.date, description:'Invoice '+inv.no+' — '+custName(inv.customerId), lines, customerId:inv.customerId, invoiceId:inv.id };
  CO().journal.push(je); saveData();
}
function postCreditNote(cn){
  const vat = round2((cn.total||0) * (cn.vatPct||0) / (100+ (cn.vatPct||0)) );
  const net = round2(cn.total - vat);
  const lines = [{accountId:SALES_ACCOUNT, debit:net, credit:0}, {accountId:AR_ACCOUNT, debit:0, credit:cn.total}];
  if(vat>0) lines.push({accountId:VAT_ACCOUNT, debit:vat, credit:0});
  const je = { id:uid('je'), date:cn.date, description:'Credit Note '+cn.no+' — '+custName(cn.customerId), lines, customerId:cn.customerId, creditNoteId:cn.id };
  CO().journal.push(je); saveData();
}
function postSupplierInvoice(inv){
  const vat = round2((inv.total||0) * (inv.vatPct||0) / (100+ (inv.vatPct||0)) );
  const net = round2(inv.total - vat);
  const lines = [{accountId:inv.expenseAccountId||'a2100', debit:net, credit:0}, {accountId:AP_ACCOUNT, debit:0, credit:inv.total}];
  if(vat>0) lines.push({accountId:VAT_ACCOUNT, debit:vat, credit:0});
  const je = { id:uid('je'), date:inv.date, description:'Supplier Inv '+inv.no+' — '+suppName(inv.supplierId), lines, supplierId:inv.supplierId, supplierInvoiceId:inv.id };
  CO().journal.push(je); saveData();
}
function round2(n){ return Math.round((n||0)*100)/100; }
function custName(id){ const c = CO().customers.find(x=>x.id===id); return c? c.name : 'Unknown customer'; }
function suppName(id){ const s = CO().suppliers.find(x=>x.id===id); return s? s.name : 'Unknown supplier'; }

// receipts/payments come in via bank allocation once a line's contra is AR/AP tagged to a customer/supplier
function customerReceipts(customerId, asOf){
  let total = 0;
  CO().journal.forEach(je=>{
    if(je.customerId!==customerId || je.invoiceId || je.creditNoteId) return; // exclude the invoice/CN postings themselves
    if(asOf && je.date>asOf) return;
    const l = je.lines.find(l=>l.accountId===AR_ACCOUNT);
    if(l) total += (l.credit||0) - (l.debit||0); // credit to AR = money received, reduces balance
  });
  return total;
}
function supplierPayments(supplierId, asOf){
  let total = 0;
  CO().journal.forEach(je=>{
    if(je.supplierId!==supplierId || je.supplierInvoiceId) return;
    if(asOf && je.date>asOf) return;
    const l = je.lines.find(l=>l.accountId===AP_ACCOUNT);
    if(l) total += (l.debit||0) - (l.credit||0); // debit to AP = money paid, reduces balance
  });
  return total;
}
function customerBalance(customerId, asOf){
  const invTotal = CO().salesInvoices.filter(i=>i.customerId===customerId && (!asOf || i.date<=asOf)).reduce((s,i)=>s+i.total,0);
  const cnTotal = CO().creditNotes.filter(c=>c.customerId===customerId && (!asOf || c.date<=asOf)).reduce((s,c)=>s+c.total,0);
  return round2(invTotal - cnTotal - customerReceipts(customerId, asOf));
}
function supplierBalance(supplierId, asOf){
  const invTotal = CO().supplierInvoices.filter(i=>i.supplierId===supplierId && (!asOf || i.date<=asOf)).reduce((s,i)=>s+i.total,0);
  return round2(invTotal - supplierPayments(supplierId, asOf));
}
// FIFO age analysis: walk invoices oldest-first, absorb credits/receipts, bucket the remainder by age
function ageAnalysis(kind, asOf){
  const reportDate = asOf || new Date().toISOString().slice(0,10);
  const parties = kind==='debtors' ? CO().customers : CO().suppliers;
  return parties.map(p=>{
    const invoices = (kind==='debtors' ? CO().salesInvoices.filter(i=>i.customerId===p.id) : CO().supplierInvoices.filter(i=>i.supplierId===p.id))
      .filter(i=>i.date<=reportDate).slice().sort((a,b)=>a.date<b.date?-1:1);
    let offset = kind==='debtors'
      ? CO().creditNotes.filter(c=>c.customerId===p.id && c.date<=reportDate).reduce((s,c)=>s+c.total,0) + customerReceipts(p.id, reportDate)
      : supplierPayments(p.id, reportDate);
    const buckets = {current:0, d30:0, d60:0, d90:0, d120:0};
    invoices.forEach(inv=>{
      let remaining = inv.total;
      if(offset>0){ const applied = Math.min(offset, remaining); remaining -= applied; offset -= applied; }
      if(remaining<=0.005) return;
      const days = Math.floor((new Date(reportDate) - new Date(inv.date)) / 86400000);
      if(days<=30) buckets.current += remaining;
      else if(days<=60) buckets.d30 += remaining;
      else if(days<=90) buckets.d60 += remaining;
      else if(days<=120) buckets.d90 += remaining;
      else buckets.d120 += remaining;
    });
    const total = buckets.current+buckets.d30+buckets.d60+buckets.d90+buckets.d120;
    return {party:p, buckets, total};
  }).filter(r=>Math.abs(r.total)>0.01);
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const rows = lines.map(l=>{
    const out=[]; let cur=''; let q=false;
    for(let i=0;i<l.length;i++){ const c=l[i];
      if(c==='"'){ q=!q; continue; }
      if(c===',' && !q){ out.push(cur); cur=''; continue; }
      cur+=c;
    }
    out.push(cur);
    return out.map(s=>s.trim());
  });
  let header = rows[0].map(h=>h.toLowerCase());
  let dataRows = rows;
  const hasHeader = header.some(h=>h.includes('date')) && header.some(h=>h.includes('amount')||h.includes('desc'));
  if(hasHeader) dataRows = rows.slice(1);
  const idx = {
    date: hasHeader? header.findIndex(h=>h.includes('date')) : 0,
    desc: hasHeader? header.findIndex(h=>h.includes('desc')) : 1,
    amount: hasHeader? header.findIndex(h=>h.includes('amount')) : 2,
    balance: hasHeader? header.findIndex(h=>h.includes('bal')) : 3,
  };
  return dataRows.filter(r=>r.length>=2).map(r=>({
    date: r[idx.date]||'', description: r[idx.desc]||'',
    amount: parseFloat((r[idx.amount]||'0').replace(/[^0-9.-]/g,''))||0,
    balance: r[idx.balance]!==undefined ? parseFloat((r[idx.balance]||'0').replace(/[^0-9.-]/g,'')) : null,
  }));
}
function normalizeDate(s){
  if(!s) return '';
  s = s.trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(m) return s;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let [_,d,mo,y] = m; if(y.length===2) y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  m = s.match(/^(\d{1,2})([A-Za-z]{3})(\d{2,4})$/);
  if(m){
    const months={JAN:'01',FEB:'02',MAR:'03',APR:'04',MAY:'05',JUN:'06',JUL:'07',AUG:'08',SEP:'09',OCT:'10',NOV:'11',DEC:'12'};
    let [_,d,mo,y]=m; if(y.length===2) y='20'+y;
    return `${y}-${(months[mo.toUpperCase()]||'01')}-${d.padStart(2,'0')}`;
  }
  const dt = new Date(s); if(!isNaN(dt)) return dt.toISOString().slice(0,10);
  return s;
}

function exportPDF(title, subtitle, headerRow, dataRows, opts){
  opts = opts || {};

  const doc = new jsPDF(opts.landscape? {orientation:'landscape'} : undefined);
  const pageW = doc.internal.pageSize.getWidth();
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(20,30,45);
  doc.text(CO().name, 14, 16);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(60,70,85);
  doc.text(title, 14, 23);
  doc.setFontSize(9); doc.setTextColor(120,130,145);
  doc.text(subtitle, 14, 29);
  doc.setDrawColor(200,206,216); doc.line(14, 32, pageW-14, 32);
  doc.autoTable({
    startY:36, head:[headerRow], body:dataRows,
    styles:{fontSize:8.5, cellPadding:2.6, textColor:[30,38,50]},
    headStyles:{fillColor:[31,58,95], textColor:255, fontStyle:'bold'},
    alternateRowStyles:{fillColor:[247,249,252]},
    margin:{left:14,right:14},
    didParseCell: function(data){
      if(opts.boldRows && opts.boldRows.includes(data.row.index) && data.section==='body'){
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [234,239,247];
      }
    },
    didDrawPage: function(data){
      const pc = doc.internal.getNumberOfPages();
      doc.setFontSize(8); doc.setTextColor(140,148,160);
      doc.text('Ledgerline · '+CO().name, 14, doc.internal.pageSize.getHeight()-8);
      doc.text('Page '+doc.internal.getCurrentPageInfo().pageNumber+' of '+pc, pageW-14, doc.internal.pageSize.getHeight()-8, {align:'right'});
      doc.text(new Date().toLocaleString('en-ZA'), pageW/2, doc.internal.pageSize.getHeight()-8, {align:'center'});
    }
  });
  doc.save(title.replace(/[^\w]+/g,'_')+'.pdf');
}

   CASHBOOK BATCHES  (grid + New Batch modal, mirrors Sage's batch list)

function renderBatches(main){
  const bankAccounts = CO().accounts.filter(a=>a.isBank);
  const batches = CO().statements.slice().sort((a,b)=> a.batchNo<b.batchNo?1:-1);
  main.innerHTML = `
    <div class="pagehead"><div class="pagetitle">Cashbook Batches</div><div class="pagesub">Each imported bank statement becomes a batch you allocate and post</div></div>
    <div class="gridtoolbar">
      <button class="linkbtn" id="newBatchBtn"><span class="ic">+</span>New Batch...</button>
      <button class="linkbtn" id="openBatchBtn" ${ui.selectedBatch?'':'disabled'}><span class="ic">▤</span>Open Batch...</button>
      <button class="linkbtn" id="propBatchBtn" ${ui.selectedBatch?'':'disabled'}><span class="ic">✎</span>Batch Properties...</button>
      <button class="linkbtn del" id="delBatchBtn" ${ui.selectedBatch?'':'disabled'}><span class="ic">×</span>Delete</button>
    </div>
    ${batches.length===0 ? `<div class="empty"><div class="big">No cashbook batches yet</div>Click "New Batch..." to import a bank statement CSV.</div>` : `
    <table>
      <thead><tr><th>Batch No</th><th>Description</th><th>Bank Account</th><th class="right">Lines</th><th class="center">Status</th><th>Last Processed Date</th></tr></thead>
      <tbody>
        ${batches.map(s=>{
          const lines = CO().bankfeed.filter(t=>t.statementId===s.id);
          const allPosted = lines.length>0 && lines.every(t=>t.status==='posted');
          return `<tr class="${ui.selectedBatch===s.id?'sel':''}" data-row="${s.id}">
            <td class="num">${s.batchNo}</td>
            <td>${s.description}</td>
            <td>${acct(s.bankAccountId)? acct(s.bankAccountId).name : '—'}</td>
            <td class="right num">${lines.length}</td>
            <td class="center"><span class="tag ${s.reconciled?'recon':(allPosted?'posted':'unalloc')}">${s.reconciled?'reconciled':(allPosted?'posted':'pending')}</span></td>
            <td class="num">${fmtDate(s.importedAt)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  `;
  main.querySelectorAll('[data-row]').forEach(tr=>{
    tr.onclick = ()=>{ ui.selectedBatch = (ui.selectedBatch===tr.dataset.row)? null : tr.dataset.row; renderBatches(main); };
  });
  document.getElementById('newBatchBtn').onclick = ()=>{ ui.modal='newBatch'; ui.importPreview=null; ui.importBank = ui.importBank || (bankAccounts[0] && bankAccounts[0].id); renderModal(); };
  const openBtn = document.getElementById('openBatchBtn');
  if(openBtn) openBtn.onclick = ()=>{ ui.allocFilterBatch = ui.selectedBatch; ui.tab='allocate'; renderShell(); };
  const propBtn = document.getElementById('propBatchBtn');
  if(propBtn) propBtn.onclick = ()=>{ ui.modal='batchProps'; renderModal(); };
  const delBtn = document.getElementById('delBatchBtn');
  if(delBtn) delBtn.onclick = ()=>{
    const s = CO().statements.find(x=>x.id===ui.selectedBatch);
    const hasPosted = CO().bankfeed.some(t=>t.statementId===s.id && t.status==='posted');
    if(hasPosted){ alert('This batch has posted transactions and cannot be deleted.'); return; }
    if(!confirm(`Delete batch ${s.batchNo} — ${s.description}? This removes its unposted lines.`)) return;
    CO().bankfeed = CO().bankfeed.filter(t=>t.statementId!==s.id);
    CO().statements = CO().statements.filter(x=>x.id!==s.id);
    ui.selectedBatch = null;
    saveData(); renderBatches(main);
  };
}

/* ---------- New Batch modal (CSV import) ---------- */
function renderNewBatchModal(){
  const bankAccounts = CO().accounts.filter(a=>a.isBank);
  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = `
    <div class="modal" style="width:640px">
      <h3>New Cashbook Batch</h3>
      <div class="field">
        <label>Bank account</label>
        <select id="bankSel">${bankAccounts.map(a=>`<option value="${a.id}" ${ui.importBank===a.id?'selected':''}>${a.code} — ${a.name}</option>`).join('')}</select>
      </div>
      <div class="drop" id="dropzone">
        <div style="font-weight:600;color:var(--tx)">Drop a CSV file here, or click to choose</div>
        <div class="hint">Columns: date, description, amount, balance</div>
        <input type="file" id="fileInput" accept=".csv,text/csv">
      </div>
      <div class="field" style="margin-top:12px">
        <label>Or paste CSV text</label>
        <textarea id="pasteArea" rows="4" placeholder="date,description,amount,balance"></textarea>
      </div>
      <div id="previewWrap"></div>
      <div class="modalrow">
        <button class="btn ghost" id="cancelNB">Cancel</button>
        <button class="btn" id="previewBtn">Preview</button>
      </div>
    </div>
  `;
  document.getElementById('app').appendChild(wrap);
  document.getElementById('cancelNB').onclick = ()=>{ ui.modal=null; renderModal(); };
  document.getElementById('bankSel').onchange = e=>{ ui.importBank = e.target.value; };
  const dz = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  dz.onclick = ()=>fileInput.click();
  dz.ondragover = e=>{ e.preventDefault(); dz.classList.add('drag'); };
  dz.ondragleave = ()=> dz.classList.remove('drag');
  dz.ondrop = e=>{ e.preventDefault(); dz.classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f) readFile(f); };
  fileInput.onchange = e=>{ const f=e.target.files[0]; if(f) readFile(f); };
  function readFile(f){ const r=new FileReader(); r.onload=()=>{ document.getElementById('pasteArea').value=r.result; doPreview(); }; r.readAsText(f); }
  document.getElementById('previewBtn').onclick = doPreview;

  function doPreview(){
    const txt = document.getElementById('pasteArea').value;
    const rows = parseCSV(txt);
    ui.importPreview = rows;
    const wrap = document.getElementById('previewWrap');
    if(!rows.length){ wrap.innerHTML=''; return; }
    wrap.innerHTML = `
      <div style="margin-top:12px;border:1px solid var(--line);border-radius:5px;padding:10px">
        <div style="margin-bottom:8px"><strong>${rows.length}</strong> rows detected</div>
        <div style="max-height:220px;overflow:auto">
          <table><thead><tr><th>Date</th><th>Description</th><th class="right">Amount</th></tr></thead>
          <tbody>${rows.slice(0,100).map(r=>`<tr><td class="num">${r.date}</td><td>${r.description}</td><td class="right num ${r.amount<0?'amt-out':'amt-in'}">${fmt(r.amount)}</td></tr>`).join('')}</tbody></table>
        </div>
        ${rows.length>100? `<div class="hint">Showing first 100 of ${rows.length} — all will be imported.</div>`:''}
      </div>`;
    document.querySelector('.modalrow #previewBtn').textContent = 'Import ' + rows.length + ' transactions';
    document.getElementById('previewBtn').onclick = ()=>{
      CO().batchSeq = (CO().batchSeq||0)+1;
      const batchNo = 'CB' + String(CO().batchSeq).padStart(3,'0');
      const statementId = uid('st');
      const closing = rows.length? rows[rows.length-1].balance : null;
      const opening = rows.length? (rows[0].balance!==null ? rows[0].balance - rows[0].amount : null) : null;
      CO().statements.push({id:statementId, batchNo, description:'Cashbook Batch — '+(acct(ui.importBank)?acct(ui.importBank).name:'Bank'), importedAt:new Date().toISOString().slice(0,10),
        bankAccountId:ui.importBank, openingBalance:opening, closingBalance:closing, reconciled:false});

      // if this bank account has never had a posted opening balance, seed one so the ledger
      // starts from the same point as the real bank account rather than from zero
      const alreadyOpened = CO().journal.some(je=>je.lines.some(l=>l.accountId===ui.importBank)) ||
                             CO().bankfeed.some(t=>t.bankAccountId===ui.importBank);
      if(!alreadyOpened && opening !== null && Math.abs(opening) > 0.001 && rows.length){
        const firstDate = normalizeDate(rows[0].date);
        const dayBefore = new Date(firstDate); dayBefore.setDate(dayBefore.getDate()-1);
        CO().bankfeed.push({ id:uid('bt'), date:dayBefore.toISOString().slice(0,10), rawDate:'', description:'Opening Balance', amount:opening, balance:opening,
          bankAccountId: ui.importBank, statementId, status:'unallocated', allocatedAccountId:null, journalEntryId:null });
      }

      rows.forEach(r=>{
        CO().bankfeed.push({ id:uid('bt'), date:normalizeDate(r.date), rawDate:r.date, description:r.description, amount:r.amount, balance:r.balance,
          bankAccountId: ui.importBank, statementId, status:'unallocated', allocatedAccountId:null, journalEntryId:null });
      });
      saveData();
      ui.importPreview=null; ui.modal=null; ui.tab='allocate'; ui.allocFilterBatch = statementId;
      renderShell();
    };
  }
}

/* =========================================================================
   ALLOCATE & POST
========================================================================= */
function renderAllocate(main){
  let items = CO().bankfeed.filter(t=> t.status!=='posted' || ui.showPosted);
  if(ui.allocFilterBatch) items = items.filter(t=>t.statementId===ui.allocFilterBatch);
  items = items.sort((a,b)=> (a.date<b.date?1:-1));
  const nonBank = CO().accounts.filter(a=>!a.isBank);
  const grouped = {Expense:[], Income:[], Asset:[], Liability:[], Equity:[]};
  nonBank.forEach(a=>grouped[a.type] && grouped[a.type].push(a));
  const batch = ui.allocFilterBatch? CO().statements.find(s=>s.id===ui.allocFilterBatch) : null;

  function optionsFor(t){
    // Accounts Receivable / Payable expand into one option per customer/supplier, so a
    // receipt or payment can be linked to the right party for age analysis
    if(t.allocatedAccountId===AR_ACCOUNT || (t.id && t.allocatedCustomerId)){}
    const opts = [];
    Object.entries(grouped).forEach(([type,accts])=>{
      accts.forEach(a=>{
        if(a.id===AR_ACCOUNT && CO().customers.length){
          opts.push(`<optgroup label="Accounts Receivable — receipt from">`+
            CO().customers.map(c=>`<option value="${a.id}::${c.id}" ${t.allocatedAccountId===a.id && t.allocatedCustomerId===c.id?'selected':''}>${c.name}</option>`).join('')+`</optgroup>`);
        } else if(a.id===AP_ACCOUNT && CO().suppliers.length){
          opts.push(`<optgroup label="Accounts Payable — payment to">`+
            CO().suppliers.map(s=>`<option value="${a.id}::${s.id}" ${t.allocatedAccountId===a.id && t.allocatedSupplierId===s.id?'selected':''}>${s.name}</option>`).join('')+`</optgroup>`);
        }
      });
    });
    Object.entries(grouped).forEach(([type,accts])=>{
      if(!accts.length) return;
      opts.push(`<optgroup label="${type}">`+accts.map(a=>`<option value="${a.id}" ${t.allocatedAccountId===a.id && !t.allocatedCustomerId && !t.allocatedSupplierId?'selected':''}>${a.code} — ${a.name}</option>`).join('')+`</optgroup>`);
    });
    return opts.join('');
  }

  main.innerHTML = `
    <div class="pagehead"><div class="pagetitle">Allocate & Post</div><div class="pagesub">${batch? 'Batch '+batch.batchNo+' — '+batch.description : 'All batches'} — assign each line to an account, then post</div></div>
    <div class="gridtoolbar">
      ${batch? `<button class="linkbtn" id="clearFilter"><span class="ic">×</span>Show all batches</button>` : ''}
      <button class="linkbtn" id="toggleShowPosted"><span class="ic">${ui.showPosted?'−':'+'}</span>${ui.showPosted?'Hide posted':'Show posted'}</button>
      <span style="flex:1"></span>
      <button class="btn" id="postAllBtn" ${CO().bankfeed.some(t=>t.status==='allocated')?'':'disabled'}>Post all allocated</button>
    </div>
    ${items.length===0 ? `<div class="empty"><div class="big">Nothing to allocate</div>Import a cashbook batch to get started.</div>` : `
    <table>
      <thead><tr><th>Date</th><th>Description</th><th class="right">Amount</th><th>Allocate to</th><th class="center">Status</th></tr></thead>
      <tbody>
        ${items.map(t=>`
          <tr>
            <td class="num">${fmtDate(t.date)}</td>
            <td>${t.description}</td>
            <td class="right num ${t.amount<0?'amt-out':'amt-in'}">${fmt(t.amount)}</td>
            <td>
              ${t.status==='posted' ? `<span>${acct(t.allocatedAccountId)? acct(t.allocatedAccountId).code+' — '+acct(t.allocatedAccountId).name + (t.allocatedCustomerId? ' ('+custName(t.allocatedCustomerId)+')' : t.allocatedSupplierId? ' ('+suppName(t.allocatedSupplierId)+')' : '') : '—'}</span>` : `
              <select data-alloc="${t.id}" style="min-width:240px">
                <option value="">Select account…</option>
                ${optionsFor(t)}
              </select>`}
            </td>
            <td class="center"><span class="tag ${t.status==='posted'?'posted':t.status==='allocated'?'alloc':'unalloc'}">${t.status}</span></td>
          </tr>
        `).join('')}
      </tbody>
    </table>`}
  `;
  const cf = document.getElementById('clearFilter'); if(cf) cf.onclick = ()=>{ ui.allocFilterBatch=''; renderAllocate(main); };
  document.getElementById('toggleShowPosted').onclick = ()=>{ ui.showPosted=!ui.showPosted; renderAllocate(main); };
  main.querySelectorAll('[data-alloc]').forEach(sel=>{
    sel.onchange = ()=>{
      const t = CO().bankfeed.find(x=>x.id===sel.dataset.alloc);
      const raw = sel.value;
      t.allocatedCustomerId = null; t.allocatedSupplierId = null;
      if(raw && raw.includes('::')){
        const [accId, partyId] = raw.split('::');
        t.allocatedAccountId = accId;
        if(accId===AR_ACCOUNT) t.allocatedCustomerId = partyId; else t.allocatedSupplierId = partyId;
      } else {
        t.allocatedAccountId = raw || null;
      }
      t.status = raw ? 'allocated' : 'unallocated';
      saveData(); renderAllocate(main);
    };
  });
  const postBtn = document.getElementById('postAllBtn');
  if(postBtn) postBtn.onclick = ()=>{ ui.modal='postSummary'; ui.postSummaryReturn = ()=>{ renderAllocate(main); renderShell(); }; renderModal(); };
}
function postAllocated(){
  const toPost = CO().bankfeed.filter(t=>t.status==='allocated' && t.allocatedAccountId);
  toPost.forEach(t=>{
    const isIn = t.amount >= 0;
    const amt = Math.abs(t.amount);
    const lines = isIn
      ? [{accountId:t.bankAccountId, debit:amt, credit:0},{accountId:t.allocatedAccountId, debit:0, credit:amt}]
      : [{accountId:t.bankAccountId, debit:0, credit:amt},{accountId:t.allocatedAccountId, debit:amt, credit:0}];
    const je = { id: uid('je'), date:t.date, description:t.description, lines, bankTxnId:t.id, statementId:t.statementId,
      customerId:t.allocatedCustomerId||null, supplierId:t.allocatedSupplierId||null };
    CO().journal.push(je);
    t.status='posted'; t.journalEntryId = je.id;
  });
  saveData();
}

function renderReconcile(main){

    <table>
      <thead><tr><th>Batch</th><th>Bank account</th><th class="right">Statement closing bal.</th><th class="right">Ledger balance</th><th class="right">Variance</th><th class="center">Status</th><th></th></tr></thead>
      <tbody>
        ${statements.map(s=>{
          const lines = CO().bankfeed.filter(t=>t.statementId===s.id);
          const lastLine = lines.slice().sort((a,b)=>a.date<b.date?1:-1)[0];
          const asOfDate = lastLine? lastLine.date : s.importedAt;
          const ledgerBal = accountBalance(s.bankAccountId, asOfDate);
          const variance = (s.closingBalance!==null && s.closingBalance!==undefined) ? (ledgerBal - s.closingBalance) : null;
          const allPosted = lines.length>0 && lines.every(t=>t.status==='posted');
          return `<tr>
            <td class="num">${s.batchNo}</td>
            <td>${acct(s.bankAccountId)?.name||'—'}</td>

            <td class="right num">${fmt(ledgerBal)}</td>
            <td class="right num" style="color:${Math.abs(variance||0)<0.01?'var(--green)':'var(--red)'}">${variance===null?'—':fmt(variance)}</td>
            <td class="center"><span class="tag ${s.reconciled?'recon':'unrecon'}">${s.reconciled?'reconciled':(allPosted?'ready':'pending post')}</span></td>
            <td>${!s.reconciled && allPosted && variance!==null && Math.abs(variance)<0.01 ? `<button class="btn sm" data-recon="${s.id}">Mark reconciled</button>` : (!allPosted? `<button class="btn ghost sm" data-goalloc="${s.id}">Finish allocating</button>`:'')}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  `;
  main.querySelectorAll('[data-recon]').forEach(b=>b.onclick=()=>{
    const s = CO().statements.find(x=>x.id===b.dataset.recon);
    s.reconciled = true; saveData(); renderReconcile(main); renderShell();

  main.querySelectorAll('[data-goalloc]').forEach(b=>b.onclick=()=>{ ui.allocFilterBatch=b.dataset.goalloc; ui.tab='allocate'; renderShell(); });
}

function renderNewJournalModal(){
  if(!ui.journalDraft){
    ui.journalDraft = { date:new Date().toISOString().slice(0,10), description:'', lines:[{accountId:'',debit:'',credit:''},{accountId:'',debit:'',credit:''}] };
  }
  const draft = ui.journalDraft;
  const totalDebit = draft.lines.reduce((s,l)=>s+(parseFloat(l.debit)||0),0);
  const totalCredit = draft.lines.reduce((s,l)=>s+(parseFloat(l.credit)||0),0);
  const balanced = draft.lines.length>=2 && totalDebit>0 && Math.abs(totalDebit-totalCredit)<0.005;

  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = `
    <div class="modal" style="width:640px">
      <h3>New Journal Entry</h3>
      <div class="grid g2">
        <div class="field"><label>Date</label><input type="date" id="jDate" value="${draft.date}"></div>
        <div class="field"><label>Description</label><input type="text" id="jDesc" value="${draft.description}" placeholder="e.g. Depreciation for February"></div>
      </div>
      <table style="margin:8px 0">
        <thead><tr><th>Account</th><th class="right" style="width:120px">Debit</th><th class="right" style="width:120px">Credit</th><th style="width:34px"></th></tr></thead>
        <tbody id="jLines">
          ${draft.lines.map((l,i)=>`<tr>
            <td><select data-jacct="${i}" style="min-width:220px">
              <option value="">Select account…</option>
              ${CO().accounts.slice().sort((a,b)=>a.code.localeCompare(b.code)).map(a=>`<option value="${a.id}" ${l.accountId===a.id?'selected':''}>${a.code} — ${a.name}</option>`).join('')}
            </select></td>
            <td><input type="number" step="0.01" data-jdebit="${i}" value="${l.debit}" style="text-align:right"></td>
            <td><input type="number" step="0.01" data-jcredit="${i}" value="${l.credit}" style="text-align:right"></td>
            <td><button class="btn ghost sm" data-jdel="${i}" ${draft.lines.length<=2?'disabled':''}>×</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
      <button class="linkbtn" id="jAddLine" style="border-right:none;padding-left:0"><span class="ic">+</span>Add line</button>
      <div class="statement-row total" style="margin-top:10px">
        <span>Totals</span>
        <span class="num" id="jTotalsVal" style="color:${balanced?'var(--green)':'var(--red)'}">Dr ${fmt(totalDebit)} &nbsp; Cr ${fmt(totalCredit)}</span>
      </div>
      <div class="hint" id="jHint" style="color:var(--red);display:${balanced?'none':'block'}">Debits must equal credits (and be greater than zero) before posting.</div>
      <div class="modalrow">
        <button class="btn ghost" id="cancelJ">Cancel</button>
        <button class="btn" id="postJ" ${balanced?'':'disabled'}>Post journal entry</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(wrap);

  function syncDraftFromInputs(){
    draft.date = document.getElementById('jDate').value;
    draft.description = document.getElementById('jDesc').value;
    draft.lines.forEach((l,i)=>{
      const accSel = wrap.querySelector(`[data-jacct="${i}"]`);
      const dInp = wrap.querySelector(`[data-jdebit="${i}"]`);
      const cInp = wrap.querySelector(`[data-jcredit="${i}"]`);
      if(accSel) l.accountId = accSel.value;
      if(dInp) l.debit = dInp.value;
      if(cInp) l.credit = cInp.value;
    });
  }
  function updateTotalsUI(){
    syncDraftFromInputs();
    const td = draft.lines.reduce((s,l)=>s+(parseFloat(l.debit)||0),0);
    const tc = draft.lines.reduce((s,l)=>s+(parseFloat(l.credit)||0),0);
    const ok = draft.lines.length>=2 && td>0 && Math.abs(td-tc)<0.005;
    const totalsEl = wrap.querySelector('#jTotalsVal');
    const hintEl = wrap.querySelector('#jHint');
    const postBtn = wrap.querySelector('#postJ');
    if(totalsEl){ totalsEl.style.color = ok?'var(--green)':'var(--red)'; totalsEl.textContent = 'Dr '+fmt(td)+'   Cr '+fmt(tc); }
    if(hintEl) hintEl.style.display = ok? 'none':'block';
    if(postBtn) postBtn.disabled = !ok;
  }
  // Only account selects and date/description need no structural rebuild either —
  // rebuild the modal solely when lines are added/removed; everything else updates in place.
  wrap.querySelectorAll('select[data-jacct], input[data-jdebit], input[data-jcredit]').forEach(el=>{
    el.addEventListener('input', updateTotalsUI);
    el.addEventListener('change', updateTotalsUI);
  });
  document.getElementById('jDate').addEventListener('input', syncDraftFromInputs);
  document.getElementById('jDesc').addEventListener('input', syncDraftFromInputs);
  document.getElementById('jAddLine').onclick = ()=>{ syncDraftFromInputs(); draft.lines.push({accountId:'',debit:'',credit:''}); renderModal(); wrap.remove(); };
  wrap.querySelectorAll('[data-jdel]').forEach(b=>b.onclick=()=>{
    syncDraftFromInputs();
    draft.lines.splice(parseInt(b.dataset.jdel),1);
    renderModal(); wrap.remove();
  });
  document.getElementById('cancelJ').onclick = ()=>{ ui.modal=null; ui.journalDraft=null; renderModal(); wrap.remove(); };
  document.getElementById('postJ').onclick = ()=>{
    syncDraftFromInputs();
    const lines = draft.lines.filter(l=>l.accountId && (parseFloat(l.debit)||parseFloat(l.credit)))
      .map(l=>({accountId:l.accountId, debit:parseFloat(l.debit)||0, credit:parseFloat(l.credit)||0}));
    const td = lines.reduce((s,l)=>s+l.debit,0), tc = lines.reduce((s,l)=>s+l.credit,0);
    if(lines.length<2 || Math.abs(td-tc)>0.005 || td<=0){ alert('Debits and credits must balance.'); return; }
    CO().journalSeq = (CO().journalSeq||0)+1;
    const je = { id:uid('je'), journalNo:'JNL'+String(CO().journalSeq).padStart(3,'0'), date:draft.date, description:draft.description||'Journal entry', lines, manual:true };
    CO().journal.push(je);
    saveData();
    ui.modal=null; ui.journalDraft=null; ui.tab='journals';
    renderShell();
  };
}

function ledgerRows(accountId){
  const a = acct(accountId); const normal = normalIsDebit(a.type);
  let running = 0; const rows = [];
  CO().journal.filter(je=>je.lines.some(l=>l.accountId===accountId)).sort((x,y)=>x.date<y.date?-1:1)
    .forEach(je=>{
      const l = je.lines.find(l=>l.accountId===accountId);
      running += normal ? (l.debit-l.credit) : (l.credit-l.debit);
      rows.push({date:je.date, desc:je.description, debit:l.debit, credit:l.credit, running});
    });
  return rows;
}
function renderLedgerBody(accountId){
  const body = document.getElementById('ledgerBody');
  const rows = ledgerRows(accountId);
  if(!rows.length){ body.innerHTML = `<div class="empty">No posted transactions for this account yet.</div>`; return; }
  body.innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Description</th><th class="right">Debit</th><th class="right">Credit</th><th class="right">Balance</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr><td class="num">${fmtDate(r.date)}</td><td>${r.desc}</td>
          <td class="right num">${r.debit? fmt(r.debit):''}</td><td class="right num">${r.credit? fmt(r.credit):''}</td>
          <td class="right num" style="font-weight:700">${fmt(r.running)}</td></tr>`).join('')}
      </tbody>
    </table>`;
}

/* =========================================================================
   LEDGER ACCOUNTS (full report — every account, grouped by type, with
   opening/closing balances — mirrors a classic "Ledger Accounts" printout)
========================================================================= */
function renderLedgerAccounts(main){
  const today = new Date().toISOString().slice(0,10);
  const start = ui.laStart || (today.slice(0,4)+'-01-01');
  const end = ui.laEnd || today;
  const dayBefore = new Date(new Date(start).getTime()-86400000).toISOString().slice(0,10);
  const types = ACCOUNT_TYPES_LIST;

  function accountBlock(a){
    const opening = accountBalance(a.id, dayBefore);
    const normal = normalIsDebit(a.type);
    let running = opening;
    const rows = [];
    CO().journal.filter(je=>je.lines.some(l=>l.accountId===a.id) && je.date>=start && je.date<=end).sort((x,y)=>x.date<y.date?-1:1)
      .forEach(je=>{
        const l = je.lines.find(l=>l.accountId===a.id);
        running += normal ? (l.debit-l.credit) : (l.credit-l.debit);
        rows.push({date:je.date, desc:je.description, debit:l.debit, credit:l.credit, running});
      });
    if(opening===0 && rows.length===0) return null;
    return {account:a, opening, rows, closing:running};
  }

  const blocksByType = {};
  types.forEach(t=>{
    blocksByType[t] = CO().accounts.filter(a=>a.accountType===t).sort((a,b)=>a.code.localeCompare(b.code)).map(accountBlock).filter(Boolean);
  });

  main.innerHTML = `
    <div class="pagehead"><div class="pagetitle">Ledger Accounts</div><div class="pagesub">Every account's activity for the period, grouped by type</div></div>
    <div class="toolbar">
      <input type="date" id="laStart" value="${start}" style="width:150px">
      <input type="date" id="laEnd" value="${end}" style="width:150px">
      <button class="linkbtn" id="exPdf"><span class="ic">P</span>Export PDF</button>
      <button class="linkbtn" id="exXls"><span class="ic">X</span>Export Excel</button>
    </div>
    ${types.map(t=>{
      const blocks = blocksByType[t];
      if(!blocks.length) return '';
      return `<div class="statement-group">Account Type: ${t}</div>` + blocks.map(b=>`
        <table style="margin-bottom:10px">
          <thead><tr><th colspan="2">${b.account.code} (${b.account.name})</th><th class="right">Debit</th><th class="right">Credit</th><th class="right">Balance</th></tr></thead>
          <tbody>
            <tr><td colspan="2">Opening Balance</td><td></td><td></td><td class="right num">${fmt(b.opening)}</td></tr>
            ${b.rows.map(r=>`<tr><td class="num" style="width:90px">${fmtDate(r.date)}</td><td>${r.desc}</td><td class="right num">${r.debit? fmt(r.debit):''}</td><td class="right num">${r.credit? fmt(r.credit):''}</td><td class="right num">${fmt(r.running)}</td></tr>`).join('')}
            <tr style="font-weight:700"><td colspan="2">Closing Balance</td><td></td><td></td><td class="right num">${fmt(b.closing)}</td></tr>
          </tbody>
        </table>`).join('');
    }).join('')}
  `;
  document.getElementById('laStart').onchange = e=>{ ui.laStart=e.target.value; renderLedgerAccounts(main); };
  document.getElementById('laEnd').onchange = e=>{ ui.laEnd=e.target.value; renderLedgerAccounts(main); };
  document.getElementById('exPdf').onclick = ()=>{
    const rows = [];
    types.forEach(t=>{
      const blocks = blocksByType[t];
      if(!blocks.length) return;
      rows.push(['Account Type: '+t,'','','','']);
      blocks.forEach(b=>{
        rows.push([b.account.code+' ('+b.account.name+')','','','','']);
        rows.push(['','Opening Balance','','',fmt(b.opening)]);
        b.rows.forEach(r=>rows.push([fmtDate(r.date), r.desc, r.debit?fmt(r.debit):'', r.credit?fmt(r.credit):'', fmt(r.running)]));
        rows.push(['','Closing Balance','','',fmt(b.closing)]);
      });
    });
    exportPDF('Ledger Accounts', CO().name+' — For: '+fmtDate(start)+' To: '+fmtDate(end), ['Date','Reference / Description','Debit','Credit','Balance'], rows);
  };
  document.getElementById('exXls').onclick = ()=>{
    const rows = [];
    types.forEach(t=>{
      const blocks = blocksByType[t];
      if(!blocks.length) return;
      rows.push(['Account Type: '+t]);
      blocks.forEach(b=>{
        rows.push([b.account.code+' ('+b.account.name+')']);
        rows.push(['', 'Opening Balance', '', '', b.opening]);
        b.rows.forEach(r=>rows.push([r.date, r.desc, r.debit||0, r.credit||0, r.running]));
        rows.push(['', 'Closing Balance', '', '', b.closing]);
      });
    });
    exportExcel('Ledger_Accounts.xlsx', 'Ledger Accounts', ['Date','Reference / Description','Debit','Credit','Balance'], rows);
  };
}

        <tr style="font-weight:700"><td></td><td>Total</td><td class="right num">${fmt(totalDebit)}</td><td class="right num">${fmt(totalCredit)}</td></tr>
      </tbody>

  `;

  document.getElementById('exXls').onclick = ()=> exportExcel('Trial_Balance.xlsx', 'Trial Balance', ['Code','Account','Debit','Credit'],
    rows.map(r=>[r.a.code, r.a.name, r.debit, r.credit]).concat([['','Total', totalDebit, totalCredit]]));
}

/* =========================================================================
   BALANCE SHEET
========================================================================= */
function renderBS(main){
  const asOf = ui.bsDate || new Date().toISOString().slice(0,10);
  const sumB = accts=>accts.reduce((s,a)=>s+accountBalance(a.id,asOf),0);

  // group accounts into the 3-level Sage structure: bsGroup (Non-Current/Current) -> accountType -> accounts
  function threeLevel(topType, bsGroupOrder){
    const accts = CO().accounts.filter(a=>a.type===topType);
    return bsGroupOrder.map(bsGroup=>{
      const inGroup = accts.filter(a=>typeMeta(a.accountType).bsGroup===bsGroup);
      const byAccountType = {};
      inGroup.forEach(a=>{ (byAccountType[a.accountType] = byAccountType[a.accountType]||[]).push(a); });
      const subgroups = Object.entries(byAccountType).map(([accountType, list])=>({accountType, list, total:sumB(list)}));
      return { bsGroup, subgroups, total: sumB(inGroup) };
    }).filter(g=>g.subgroups.length);
  }

  const assetGroups = threeLevel('Asset', ['Non-Current Assets','Current Assets']);
  const liabGroups = threeLevel('Liability', ['Non-Current Liabilities','Current Liabilities']);
  const equity = CO().accounts.filter(a=>a.type==='Equity');
  const income = CO().accounts.filter(a=>a.type==='Income').reduce((s,a)=>s+accountBalance(a.id,asOf),0);
  const expense = CO().accounts.filter(a=>a.type==='Expense').reduce((s,a)=>s+accountBalance(a.id,asOf),0);
  const netIncome = income - expense;
  const totalAssets = assetGroups.reduce((s,g)=>s+g.total,0);
  const totalLiab = liabGroups.reduce((s,g)=>s+g.total,0);
  const totalEquity = sumB(equity) + netIncome;
  const totLiabEq = totalLiab + totalEquity;

  function renderGroups(groups){
    return groups.map(g=>`
      <div class="statement-group" style="background:#dbe6f5;color:var(--navy)">${g.bsGroup}</div>
      ${g.subgroups.map(sg=>`
        <div class="statement-group" style="background:#eef3fa;color:var(--navy2);font-size:10.5px">${sg.accountType}</div>
        ${sg.list.map(a=>`<div class="statement-row indent"><span>${a.name}</span><span class="num">${fmt(accountBalance(a.id,asOf))}</span></div>`).join('')}
      `).join('')}
      <div class="statement-row total"><span>Total ${g.bsGroup}</span><span class="num">${fmt(g.total)}</span></div>
    `).join('');
  }

  main.innerHTML = `
    <div class="pagehead"><div class="pagetitle">Statement of Financial Position</div><div class="pagesub">As of a chosen date</div></div>
    <div class="toolbar">
      <input type="date" id="bsDate" value="${asOf}" style="width:170px">
      <button class="linkbtn" id="exPdf"><span class="ic">P</span>Export PDF</button>
      <button class="linkbtn" id="exXls"><span class="ic">X</span>Export Excel</button>
    </div>
    <div class="card">
      <div class="statement-group">Assets</div>
      ${renderGroups(assetGroups)}
      <div class="statement-row total" style="border-top:2px solid var(--blue)"><span>Total Assets</span><span class="num">${fmt(totalAssets)}</span></div>

      <div class="statement-group">Equity &amp; Liabilities</div>
      <div class="statement-group" style="background:#dbe6f5;color:var(--navy)">Equity</div>
      ${equity.map(a=>`<div class="statement-row indent"><span>${a.name}</span><span class="num">${fmt(accountBalance(a.id,asOf))}</span></div>`).join('')}
      <div class="statement-row indent"><span>Net income to date</span><span class="num">${fmt(netIncome)}</span></div>
      <div class="statement-row total"><span>Total Equity</span><span class="num">${fmt(totalEquity)}</span></div>

      ${renderGroups(liabGroups)}

      <div class="statement-row total" style="margin-top:10px;border-top:2px solid var(--blue)">
        <span>Total Equity &amp; Liabilities</span>
        <span class="num" style="color:${Math.abs(totLiabEq-totalAssets)<0.01?'var(--green)':'var(--red)'}">${fmt(totLiabEq)}</span>
      </div>
    </div>
  `;
  document.getElementById('bsDate').onchange = e=>{ ui.bsDate = e.target.value; renderBS(main); };

  function flatRows(groups, fmtFn){
    const rows = [];
    groups.forEach(g=>{
      rows.push([g.bsGroup, fmtFn(0)===fmtFn(0)?'':'']);
      g.subgroups.forEach(sg=>{
        rows.push([sg.accountType, '']);
        sg.list.forEach(a=>rows.push([a.name, fmtFn(accountBalance(a.id,asOf))]));
      });
      rows.push(['Total '+g.bsGroup, fmtFn(g.total)]);
    });
    return rows;
  }
  document.getElementById('exPdf').onclick = ()=>{
    const line = a=>[a.name, fmt(accountBalance(a.id,asOf))];
    const rows = [
      ...flatRows(assetGroups, fmt), ['Total Assets', fmt(totalAssets)],
      ['Equity',''], ...equity.map(line), ['Net income to date', fmt(netIncome)], ['Total Equity', fmt(totalEquity)],
      ...flatRows(liabGroups, fmt),
      ['Total Equity & Liabilities', fmt(totLiabEq)],
    ];
    exportPDF('Statement of Financial Position', CO().name+' — For: '+fmtDate(asOf), ['Account','Amount'], rows);
  };
  document.getElementById('exXls').onclick = ()=>{
    const line = a=>[a.name, accountBalance(a.id,asOf)];
    const rows = [
      ...flatRows(assetGroups, x=>x), ['Total Assets', totalAssets],
      ['Equity'], ...equity.map(line), ['Net income to date', netIncome], ['Total Equity', totalEquity],
      ...flatRows(liabGroups, x=>x),
      ['Total Equity & Liabilities', totLiabEq],
    ];
    exportExcel('Statement_of_Financial_Position.xlsx', 'Balance Sheet', ['Account','Amount'], rows);
  };
}

/* =========================================================================
   INCOME STATEMENT
========================================================================= */
function monthRange(y, m){ // returns [start, end] iso for given year(YYYY) and month index 0-11
  const s = new Date(y, m, 1);
  const e = new Date(y, m+1, 0);
  return [s.toISOString().slice(0,10), e.toISOString().slice(0,10)];
}
function financialYearMonths(endDate){
  // 12 months ending in the month of endDate, oldest first (matches "March->Feb" style Sage report)
  const end = new Date(endDate);
  const months = [];
  for(let i=11;i>=0;i--){
    const d = new Date(end.getFullYear(), end.getMonth()-i, 1);
    months.push(monthRange(d.getFullYear(), d.getMonth()));
  }
  return months;
}
function renderIS(main){
  const today = new Date().toISOString().slice(0,10);
  const start = ui.isStart || (today.slice(0,4)+'-01-01');
  const end = ui.isEnd || today;
  const mode = ui.isMode || 'period'; // 'period' | 'monthly'
  const comparative = !!ui.isComparative;
  const spanDays = Math.round((new Date(end)-new Date(start))/86400000)+1;
  const priorEnd = new Date(new Date(start).getTime()-86400000).toISOString().slice(0,10);
  const priorStart = new Date(new Date(priorEnd).getTime()-(spanDays-1)*86400000).toISOString().slice(0,10);

  const revenue = CO().accounts.filter(a=>a.accountType==='Revenue');
  const cos = CO().accounts.filter(a=>a.accountType==='Cost of Sales');
  const otherInc = CO().accounts.filter(a=>a.accountType==='Other Income');
  const otherExp = CO().accounts.filter(a=>a.accountType==='Other Expense');
  const taxExp = CO().accounts.filter(a=>a.accountType==='Tax Expense');

  function sumGroup(accts, s, e){ return accts.reduce((sum,a)=>sum+accountMovement(a.id,s,e),0); }
  function calcFor(s,e){
    const totRev = sumGroup(revenue,s,e), totCOS = sumGroup(cos,s,e);
    const grossProfit = totRev - totCOS;
    const totOtherInc = sumGroup(otherInc,s,e), totOtherExp = sumGroup(otherExp,s,e);
    const profitBeforeTax = grossProfit + totOtherInc - totOtherExp;
    const totTax = sumGroup(taxExp,s,e);
    const profitAfterTax = profitBeforeTax - totTax;
    return {totRev, totCOS, grossProfit, totOtherInc, totOtherExp, profitBeforeTax, totTax, profitAfterTax};
  }

  main.innerHTML = `
    <div class="pagehead"><div class="pagetitle">Statement of Comprehensive Income</div><div class="pagesub">Revenue, cost of sales, and expenses for ${CO().name}</div></div>
    <div class="toolbar">
      <select id="isMode"><option value="period" ${mode==='period'?'selected':''}>Period</option><option value="monthly" ${mode==='monthly'?'selected':''}>Monthly (year)</option></select>
      ${mode==='period'? `
        <input type="date" id="isStart" value="${start}" style="width:150px">
        <input type="date" id="isEnd" value="${end}" style="width:150px">
        <label style="display:flex;align-items:center;gap:6px;font-weight:400;text-transform:none;font-size:12.5px"><input type="checkbox" id="isCompChk" style="width:auto" ${comparative?'checked':''}> Comparative</label>
      ` : `
        <input type="date" id="isYearEnd" value="${end}" style="width:150px">
      `}
      <button class="linkbtn" id="exPdf"><span class="ic">P</span>Export PDF</button>
      <button class="linkbtn" id="exXls"><span class="ic">X</span>Export Excel</button>
    </div>
    <div id="isBody"></div>
  `;
  document.getElementById('isMode').onchange = e=>{ ui.isMode=e.target.value; renderIS(main); };

  if(mode==='period'){
    const cur = calcFor(start,end), pri = calcFor(priorStart,priorEnd);
    function row(a, calc){
      const c = accountMovement(a.id,start,end);
      return `<div class="statement-row indent"><span>${a.name}</span><span class="num">${fmt(c)}</span>${comparative?`<span class="num" style="color:var(--tx2)">${fmt(accountMovement(a.id,priorStart,priorEnd))}</span>`:''}</div>`;
    }
    document.getElementById('isBody').innerHTML = `
      <div class="card">
        ${comparative? `<div class="statement-row" style="font-weight:700;color:var(--tx2)"><span></span><span class="num">${fmtDate(start)} – ${fmtDate(end)}</span><span class="num">${fmtDate(priorStart)} – ${fmtDate(priorEnd)}</span></div>`:''}
        <div class="statement-group">Revenue</div>
        ${revenue.map(a=>row(a)).join('')}
        <div class="statement-row total"><span>Total Revenue</span><span class="num">${fmt(cur.totRev)}</span>${comparative?`<span class="num">${fmt(pri.totRev)}</span>`:''}</div>
        <div class="statement-group">Cost of Sales</div>
        ${cos.map(a=>row(a)).join('')}
        <div class="statement-row total"><span>Total Cost of Sales</span><span class="num">${fmt(cur.totCOS)}</span>${comparative?`<span class="num">${fmt(pri.totCOS)}</span>`:''}</div>
        <div class="statement-row total" style="border-top:2px solid var(--blue)"><span>Gross Profit</span><span class="num">${fmt(cur.grossProfit)}</span>${comparative?`<span class="num">${fmt(pri.grossProfit)}</span>`:''}</div>
        <div class="statement-group">Other Income</div>
        ${otherInc.map(a=>row(a)).join('')}
        <div class="statement-row total"><span>Total Other Income</span><span class="num">${fmt(cur.totOtherInc)}</span>${comparative?`<span class="num">${fmt(pri.totOtherInc)}</span>`:''}</div>
        <div class="statement-group">Other Expense</div>
        ${otherExp.map(a=>row(a)).join('')}
        <div class="statement-row total"><span>Total Other Expense</span><span class="num">${fmt(cur.totOtherExp)}</span>${comparative?`<span class="num">${fmt(pri.totOtherExp)}</span>`:''}</div>
        <div class="statement-row total" style="margin-top:10px;border-top:2px solid var(--blue)">
          <span>Profit Before Tax</span><span class="num" style="color:${cur.profitBeforeTax>=0?'var(--green)':'var(--red)'}">${fmt(cur.profitBeforeTax)}</span>
          ${comparative?`<span class="num" style="color:${pri.profitBeforeTax>=0?'var(--green)':'var(--red)'}">${fmt(pri.profitBeforeTax)}</span>`:''}
        </div>
        ${taxExp.length? `
        <div class="statement-group">Tax Expense</div>
        ${taxExp.map(a=>row(a)).join('')}
        <div class="statement-row total"><span>Total Tax Expense</span><span class="num">${fmt(cur.totTax)}</span>${comparative?`<span class="num">${fmt(pri.totTax)}</span>`:''}</div>
        <div class="statement-row total" style="border-top:2px solid var(--blue)">
          <span>Net Profit After Tax</span><span class="num" style="color:${cur.profitAfterTax>=0?'var(--green)':'var(--red)'}">${fmt(cur.profitAfterTax)}</span>
          ${comparative?`<span class="num" style="color:${pri.profitAfterTax>=0?'var(--green)':'var(--red)'}">${fmt(pri.profitAfterTax)}</span>`:''}
        </div>` : ''}
      </div>`;
    if(comparative){
      document.querySelectorAll('#isBody .statement-row').forEach(r=>{ r.style.display='grid'; r.style.gridTemplateColumns='1fr 140px 140px'; r.style.gap='10px'; });
    }
    document.getElementById('isStart').onchange = e=>{ ui.isStart=e.target.value; renderIS(main); };
    document.getElementById('isEnd').onchange = e=>{ ui.isEnd=e.target.value; renderIS(main); };
    document.getElementById('isCompChk').onchange = e=>{ ui.isComparative=e.target.checked; renderIS(main); };
    document.getElementById('exPdf').onclick = ()=>{
      const header = comparative? ['Account','Current','Prior'] : ['Account','Amount'];
      const line = a=> comparative? [a.name, fmt(accountMovement(a.id,start,end)), fmt(accountMovement(a.id,priorStart,priorEnd))] : [a.name, fmt(accountMovement(a.id,start,end))];
      const totalRow = (label,c,p)=> comparative? [label, fmt(c), fmt(p)] : [label, fmt(c)];
      const rows = [ ...revenue.map(line), totalRow('Total Revenue', cur.totRev, pri.totRev),
        ...cos.map(line), totalRow('Total Cost of Sales', cur.totCOS, pri.totCOS), totalRow('Gross Profit', cur.grossProfit, pri.grossProfit),
        ...otherInc.map(line), totalRow('Total Other Income', cur.totOtherInc, pri.totOtherInc),
        ...otherExp.map(line), totalRow('Total Other Expense', cur.totOtherExp, pri.totOtherExp), totalRow('Profit Before Tax', cur.profitBeforeTax, pri.profitBeforeTax),
        ...(taxExp.length? [...taxExp.map(line), totalRow('Total Tax Expense', cur.totTax, pri.totTax), totalRow('Net Profit After Tax', cur.profitAfterTax, pri.profitAfterTax)] : []) ];
      const boldRows = [revenue.length, revenue.length+1+cos.length, revenue.length+1+cos.length+1+otherInc.length, revenue.length+cos.length+otherInc.length+otherExp.length+3]
        .filter((v,i,a)=>a.indexOf(v)===i);
      exportPDF('Statement of Comprehensive Income', 'For: '+fmtDate(start)+' To: '+fmtDate(end), header, rows, {boldRows});
    };
    document.getElementById('exXls').onclick = ()=>{
      const header = comparative? ['Account','Current','Prior'] : ['Account','Amount'];
      const line = a=> comparative? [a.name, accountMovement(a.id,start,end), accountMovement(a.id,priorStart,priorEnd)] : [a.name, accountMovement(a.id,start,end)];
      const totalRow = (label,c,p)=> comparative? [label, c, p] : [label, c];
      const rows = [ ['Revenue',''], ...revenue.map(line), totalRow('Total Revenue', cur.totRev, pri.totRev),
        ['Cost of Sales',''], ...cos.map(line), totalRow('Total Cost of Sales', cur.totCOS, pri.totCOS), totalRow('Gross Profit', cur.grossProfit, pri.grossProfit),
        ['Other Income',''], ...otherInc.map(line), totalRow('Total Other Income', cur.totOtherInc, pri.totOtherInc),
        ['Other Expense',''], ...otherExp.map(line), totalRow('Total Other Expense', cur.totOtherExp, pri.totOtherExp), totalRow('Profit Before Tax', cur.profitBeforeTax, pri.profitBeforeTax),
        ...(taxExp.length? [['Tax Expense',''], ...taxExp.map(line), totalRow('Total Tax Expense', cur.totTax, pri.totTax), totalRow('Net Profit After Tax', cur.profitAfterTax, pri.profitAfterTax)] : []) ];
      exportExcel('Statement_of_Comprehensive_Income.xlsx', 'Income Statement', header, rows);
    };
  } else {
    // MONTHLY — 12 columns like a Sage "Statement of Comprehensive Income Year"
    const yearEnd = document.getElementById('isYearEnd') ? document.getElementById('isYearEnd').value : end;
    const months = financialYearMonths(yearEnd);
    const monthLabel = ([s])=> new Date(s).toLocaleDateString('en-ZA',{month:'short',year:'2-digit'});
    function rowMonthly(a){
      const vals = months.map(([s,e])=>accountMovement(a.id,s,e));
      const tot = vals.reduce((x,y)=>x+y,0);
      return {name:a.name, vals, tot};
    }
    const revRows = revenue.map(rowMonthly), cosRows = cos.map(rowMonthly), oiRows = otherInc.map(rowMonthly), oeRows = otherExp.map(rowMonthly);
    function totalsOf(rows){ return months.map((_,i)=>rows.reduce((s,r)=>s+r.vals[i],0)); }
    const totRevM = totalsOf(revRows), totCOSM = totalsOf(cosRows), totOIM = totalsOf(oiRows), totOEM = totalsOf(oeRows);
    const grossProfitM = months.map((_,i)=>totRevM[i]-totCOSM[i]);
    const pbtM = months.map((_,i)=>grossProfitM[i]+totOIM[i]-totOEM[i]);
    const sumAll = arr=>arr.reduce((a,b)=>a+b,0);

    const headCols = months.map(monthLabel).concat(['Tot Actual']);
    function tblRow(label, vals, bold){
      const tot = sumAll(vals);
      return `<tr${bold?' style="font-weight:700;background:#eef3fa"':''}><td>${label}</td>${vals.map(v=>`<td class="right num">${fmt(v)}</td>`).join('')}<td class="right num">${fmt(tot)}</td></tr>`;
    }
    document.getElementById('isBody').innerHTML = `
      <div style="overflow-x:auto">
      <table style="min-width:1100px">
        <thead><tr><th>Account</th>${headCols.map(h=>`<th class="right">${h}</th>`).join('')}</tr></thead>
        <tbody>
          <tr style="background:#dbe6f5"><td colspan="${headCols.length+1}" style="font-weight:700">Revenue</td></tr>
          ${revRows.map(r=>tblRow(r.name, r.vals)).join('')}
          ${tblRow('Total Revenue', totRevM, true)}
          <tr style="background:#dbe6f5"><td colspan="${headCols.length+1}" style="font-weight:700">Cost of Sales</td></tr>
          ${cosRows.map(r=>tblRow(r.name, r.vals)).join('')}
          ${tblRow('Total Cost of Sales', totCOSM, true)}
          ${tblRow('Gross Profit', grossProfitM, true)}
          <tr style="background:#dbe6f5"><td colspan="${headCols.length+1}" style="font-weight:700">Other Income</td></tr>
          ${oiRows.map(r=>tblRow(r.name, r.vals)).join('')}
          ${tblRow('Total Other Income', totOIM, true)}
          <tr style="background:#dbe6f5"><td colspan="${headCols.length+1}" style="font-weight:700">Other Expense</td></tr>
          ${oeRows.map(r=>tblRow(r.name, r.vals)).join('')}
          ${tblRow('Total Other Expense', totOEM, true)}
          ${tblRow('Profit Before Tax', pbtM, true)}
        </tbody>
      </table>
      </div>
    `;
    document.getElementById('isYearEnd').onchange = e=>{ ui.isEnd=e.target.value; renderIS(main); };
    document.getElementById('exPdf').onclick = ()=>{
      const header = ['Account', ...headCols];
      const rows = [];
      rows.push(['Revenue', ...Array(headCols.length).fill('')]);
      revRows.forEach(r=>rows.push([r.name, ...r.vals.map(fmt), fmt(r.tot)]));
      rows.push(['Total Revenue', ...totRevM.map(fmt), fmt(sumAll(totRevM))]);
      rows.push(['Cost of Sales', ...Array(headCols.length).fill('')]);
      cosRows.forEach(r=>rows.push([r.name, ...r.vals.map(fmt), fmt(r.tot)]));
      rows.push(['Total Cost of Sales', ...totCOSM.map(fmt), fmt(sumAll(totCOSM))]);
      rows.push(['Gross Profit', ...grossProfitM.map(fmt), fmt(sumAll(grossProfitM))]);
      rows.push(['Other Income', ...Array(headCols.length).fill('')]);
      oiRows.forEach(r=>rows.push([r.name, ...r.vals.map(fmt), fmt(r.tot)]));
      rows.push(['Total Other Income', ...totOIM.map(fmt), fmt(sumAll(totOIM))]);
      rows.push(['Other Expense', ...Array(headCols.length).fill('')]);
      oeRows.forEach(r=>rows.push([r.name, ...r.vals.map(fmt), fmt(r.tot)]));
      rows.push(['Total Other Expense', ...totOEM.map(fmt), fmt(sumAll(totOEM))]);
      rows.push(['Profit Before Tax', ...pbtM.map(fmt), fmt(sumAll(pbtM))]);
      exportPDF('Statement of Comprehensive Income Year', 'For: '+monthLabel(months[0])+' To: '+monthLabel(months[months.length-1]), header, rows, {landscape:true});
    };
    document.getElementById('exXls').onclick = ()=>{
      const header = ['Account', ...headCols];
      const rows = [];
      rows.push(['Revenue']);
      revRows.forEach(r=>rows.push([r.name, ...r.vals, r.tot]));
      rows.push(['Total Revenue', ...totRevM, sumAll(totRevM)]);
      rows.push(['Cost of Sales']);
      cosRows.forEach(r=>rows.push([r.name, ...r.vals, r.tot]));
      rows.push(['Total Cost of Sales', ...totCOSM, sumAll(totCOSM)]);
      rows.push(['Gross Profit', ...grossProfitM, sumAll(grossProfitM)]);
      rows.push(['Other Income']);
      oiRows.forEach(r=>rows.push([r.name, ...r.vals, r.tot]));
      rows.push(['Total Other Income', ...totOIM, sumAll(totOIM)]);
      rows.push(['Other Expense']);
      oeRows.forEach(r=>rows.push([r.name, ...r.vals, r.tot]));
      rows.push(['Total Other Expense', ...totOEM, sumAll(totOEM)]);
      rows.push(['Profit Before Tax', ...pbtM, sumAll(pbtM)]);
      exportExcel('Statement_of_Comprehensive_Income_Year.xlsx', 'Monthly', header, rows);
    };
  }
}

function renderCustomers(main){
